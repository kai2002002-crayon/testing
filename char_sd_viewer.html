<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SD 戰鬥小人 - 完整功能版v0.3</title>
    
    <script src="data_core.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@esotericsoftware/spine-player@4.1.23/dist/spine-player.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@esotericsoftware/spine-player@4.1.23/dist/iife/spine-player.min.js"></script>

    <style>
        body { font-family: sans-serif; }
        
        /* 🐛 終極防禦：強迫 Spine 的內部包裹層與 Canvas 無條件撐滿，無視 showControls 造成的塌陷 */
        #spineContainer .spine-player,
        #spineContainer canvas {
            width: 100% !important;
            height: 100% !important;
            padding: 0 !important;
            margin: 0 !important;
            display: block !important;
            touch-action: none; /* 防止手機滑動干擾拖曳 */
        }

        .spine-player-loading { display: none !important; }

        /* 自訂捲動條 */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-100 p-4 sm:p-8 min-h-screen">

    <div class="max-w-6xl mx-auto flex flex-col md:flex-row gap-6">
        
        <div class="w-full md:w-1/4 bg-white p-5 rounded-xl shadow-sm border border-gray-200 flex flex-col">
            <h2 class="text-md font-bold text-gray-700 mb-4 border-b pb-2">1. 選擇角色</h2>
            <div id="charButtons" class="flex flex-col gap-2 overflow-y-auto max-h-[600px] custom-scrollbar pr-2">
                <span class="text-sm text-gray-400">載入中...</span>
            </div>
        </div>

        <div class="w-full md:w-3/4 bg-white p-5 rounded-xl shadow-sm border border-gray-200 flex flex-col">
            
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-3">
                <h2 class="text-md font-bold text-gray-700">
                    當前角色：<span id="currentCharName" class="text-amber-600 font-black text-xl">尚未選擇</span>
                </h2>
                <div id="costumeButtons" class="flex flex-wrap gap-2 empty:hidden"></div>
            </div>

            <div class="relative w-full h-[500px] bg-slate-800 rounded-t-xl overflow-hidden shadow-inner cursor-move">
                
                <div id="spineContainer" class="absolute inset-0"></div>
                
                <div id="loadingOverlay" class="absolute inset-0 flex items-center justify-center bg-slate-800/80 text-white font-bold z-10 hidden pointer-events-none transition-opacity duration-300">
                    <span class="animate-pulse">載入中...</span>
                </div>
            </div>

            <div id="customControls" class="bg-slate-900 rounded-b-xl p-3 flex flex-wrap items-center gap-3 opacity-50 pointer-events-none transition-opacity">
                
                <button id="btnPlayPause" onclick="togglePlay()" class="w-10 h-10 flex items-center justify-center bg-amber-500 hover:bg-amber-400 text-white rounded-lg font-bold shadow transition-colors" title="播放/暫停">
                    ⏸️
                </button>

                <button id="btnSpeed" onclick="cycleSpeed()" class="px-3 h-10 bg-slate-700 hover:bg-slate-600 text-white text-sm font-bold rounded-lg shadow transition-colors whitespace-nowrap" title="播放速度">
                    1.0x
                </button>

                <div class="relative flex-1 min-w-[120px]">
                    <button onclick="toggleDropdown('animDropdown')" class="w-full h-10 px-3 bg-slate-700 hover:bg-slate-600 text-white text-sm font-bold rounded-lg shadow transition-colors flex justify-between items-center">
                        <span id="currentAnimText" class="truncate">選擇動作</span>
                        <span>🔽</span>
                    </button>
                    <div id="animDropdown" class="absolute bottom-full left-0 mb-2 w-full bg-white border border-gray-300 rounded-lg shadow-xl z-50 hidden max-h-[200px] overflow-y-auto custom-scrollbar">
                        <div id="animList" class="flex flex-col p-1"></div>
                    </div>
                </div>

                <div class="relative flex-1 min-w-[120px]">
                    <button onclick="toggleDropdown('slotDropdown')" class="w-full h-10 px-3 bg-slate-700 hover:bg-slate-600 text-white text-sm font-bold rounded-lg shadow transition-colors flex justify-between items-center">
                        <span class="truncate">配件開關 (Slot)</span>
                        <span>🔽</span>
                    </button>
                    <div id="slotDropdown" class="absolute bottom-full right-0 mb-2 w-[220px] bg-white border border-gray-300 rounded-lg shadow-xl z-50 hidden max-h-[200px] overflow-y-auto custom-scrollbar">
                        <div id="slotList" class="flex flex-col p-2 gap-1 text-sm"></div>
                    </div>
                </div>

                <button onclick="resetCamera()" class="px-3 h-10 bg-slate-700 hover:bg-slate-600 text-white text-sm font-bold rounded-lg shadow transition-colors whitespace-nowrap" title="重置位置與縮放">
                    🔄 鏡頭
                </button>

            </div>
        </div>
    </div>

    <script>
        let globalPlayer = null;
        let currentSpeedIndex = 1;
        const speedOptions = [0.5, 1.0, 2.0, 3.0];
        
        // 🌟 預設放大 2 倍 (出現在畫面上就會直接大一倍)
        const DEFAULT_ZOOM = 2.0; 
        let currentZoom = DEFAULT_ZOOM;
        let isDragging = false;
        let lastMouseX = 0;
        let lastMouseY = 0;
        const BASE_VIEWPORT = { x: -500, y: -150, width: 1500, height: 3000 };

        // 點擊空白處關閉選單
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.relative')) {
                document.getElementById('animDropdown').classList.add('hidden');
                document.getElementById('slotDropdown').classList.add('hidden');
            }
        });

        function toggleDropdown(id) {
            const el = document.getElementById(id);
            const isHidden = el.classList.contains('hidden');
            document.getElementById('animDropdown').classList.add('hidden');
            document.getElementById('slotDropdown').classList.add('hidden');
            if (isHidden) el.classList.remove('hidden');
        }

        window.onload = function() {
            const btnContainer = document.getElementById('charButtons');
            if (typeof INITIAL_DATA === 'undefined' || INITIAL_DATA.length === 0) {
                btnContainer.innerHTML = '<span class="text-red-500">找不到資料。</span>';
                return;
            }

            btnContainer.innerHTML = '';
            INITIAL_DATA.forEach(char => {
                const btn = document.createElement('button');
                btn.innerText = char.name;
                btn.className = "w-full text-left px-4 py-2 bg-white border border-gray-200 text-gray-700 text-sm font-bold rounded shadow-sm hover:bg-amber-50 hover:border-amber-300 hover:text-amber-700 transition-colors";
                btn.onclick = () => initCharacterLoad(char.name);
                btnContainer.appendChild(btn);
            });
        };

        function initCharacterLoad(charName) {
            document.getElementById('currentCharName').innerText = charName;
            const costumeContainer = document.getElementById('costumeButtons');
            costumeContainer.innerHTML = '';

            const costumes = typeof COSTUME_MAP !== 'undefined' && COSTUME_MAP[charName] ? COSTUME_MAP[charName] : [];
            
            if (costumes.length > 0) {
                costumes.forEach((costumeKey, idx) => {
                    const btn = document.createElement('button');
                    btn.innerText = idx === 0 ? "預設服裝" : `服裝 ${idx}`;
                    btn.className = `px-3 py-1 text-xs font-bold rounded-lg border transition-colors ${idx === 0 ? 'bg-amber-500 text-white border-amber-600' : 'bg-white text-gray-600 border-gray-300 hover:bg-amber-100'}`;
                    btn.onclick = (e) => {
                        Array.from(costumeContainer.children).forEach(c => c.className = "px-3 py-1 text-xs font-bold rounded-lg border transition-colors bg-white text-gray-600 border-gray-300 hover:bg-amber-100");
                        e.target.className = "px-3 py-1 text-xs font-bold rounded-lg border transition-colors bg-amber-500 text-white border-amber-600";
                        loadSpine(charName, costumeKey);
                    };
                    costumeContainer.appendChild(btn);
                });
                loadSpine(charName, costumes[0]);
            } else {
                const baseFolderKey = typeof SPINE_MAP !== 'undefined' && SPINE_MAP[charName] ? SPINE_MAP[charName] : charName;
                loadSpine(charName, baseFolderKey);
            }
        }

        // --- 核心載入 ---
        function loadSpine(charName, costumeKey) {
            const container = document.getElementById('spineContainer');
            const overlay = document.getElementById('loadingOverlay');
            const controls = document.getElementById('customControls');
            
            if (globalPlayer) {
                globalPlayer.dispose();
                globalPlayer = null;
            }
            
            controls.classList.add('opacity-50', 'pointer-events-none');
            overlay.classList.remove('hidden');
            
            currentZoom = DEFAULT_ZOOM; // 每次載入重置為大 1 倍
            currentSpeedIndex = 1;
            updateSpeedUI();

            const skelUrl = `./spine_sd_assets/${costumeKey}.skel.bytes`;
            const atlasUrl = `./spine_sd_assets/${costumeKey}.atlas.txt`;

            globalPlayer = new spine.SpinePlayer(container, {
                skelUrl: skelUrl,
                atlasUrl: atlasUrl,
                premultipliedAlpha: false,
                backgroundColor: "#00000000",
                alpha: true,
                showControls: false, 
                showLoading: false,
                viewport: { ...BASE_VIEWPORT },

                success: function (player) {
                    overlay.classList.add('hidden');
                    controls.classList.remove('opacity-50', 'pointer-events-none');
                    const canvas = container.querySelector('canvas');
                    
                    // 皮膚與尺寸設定
                    const skins = player.skeleton.data.skins;
                    if (skins && skins.length > 0) {
                        const targetSkin = skins.find(s => s.name === 'Normal') || skins.find(s => s.name === 'default') || skins[0];
                        if (targetSkin) player.skeleton.setSkinByName(targetSkin.name);
                    }

                    // 🌟 一出場直接套用 2 倍大小
                    player.skeleton.scaleX = DEFAULT_ZOOM;
                    player.skeleton.scaleY = DEFAULT_ZOOM;
                    player.skeleton.setToSetupPose();
                    player.skeleton.updateWorldTransform();

                    // 動作設定
                    const anims = player.skeleton.data.animations.map(a => a.name);
                    buildAnimMenu(player, anims);
                    let startAnim = anims.includes("Idle") ? "Idle" : (anims.includes("idle") ? "idle" : anims[0]);

                    setTimeout(() => {
                        if (startAnim) {
                            player.animationState.setAnimation(0, startAnim, true);
                            document.getElementById('currentAnimText').innerText = startAnim;
                            document.getElementById('btnPlayPause').innerText = '⏸️';
                        }
                        player.play();

                        buildSlotMenu(player);
                        if (canvas) setupCameraControls(canvas, player);
                        window.dispatchEvent(new Event('resize'));
                    }, 50);
                },
                error: function (player, reason) {
                    overlay.innerHTML = `<span class="text-red-400">載入失敗，檔案路徑錯誤</span>`;
                }
            });
        }

        // --- 播放與速度 ---
        function togglePlay() {
            if (!globalPlayer) return;
            const btn = document.getElementById('btnPlayPause');
            if (globalPlayer.paused) {
                globalPlayer.play();
                btn.innerText = '⏸️';
            } else {
                globalPlayer.pause();
                btn.innerText = '▶️';
            }
        }

        function cycleSpeed() {
            if (!globalPlayer) return;
            currentSpeedIndex = (currentSpeedIndex + 1) % speedOptions.length;
            globalPlayer.speed = speedOptions[currentSpeedIndex];
            updateSpeedUI();
        }

        function updateSpeedUI() {
            document.getElementById('btnSpeed').innerText = `${speedOptions[currentSpeedIndex]}x`;
        }

        // --- 動作下拉選單 ---
        function buildAnimMenu(player, anims) {
            const list = document.getElementById('animList');
            list.innerHTML = '';
            anims.forEach(animName => {
                const btn = document.createElement('button');
                btn.className = "text-left px-3 py-2 text-sm font-medium text-gray-700 hover:bg-amber-100 hover:text-amber-700 rounded transition-colors";
                btn.innerText = animName;
                btn.onclick = () => {
                    player.animationState.setAnimation(0, animName, true);
                    document.getElementById('currentAnimText').innerText = animName;
                    document.getElementById('animDropdown').classList.add('hidden');
                    player.play();
                    document.getElementById('btnPlayPause').innerText = '⏸️';
                    player.skeleton.updateWorldTransform();
                };
                list.appendChild(btn);
            });
        }

        // --- 🌟 插槽(配件)下拉選單：全開/全關 & 滑過變紅 ---
        function buildSlotMenu(player) {
            const list = document.getElementById('slotList');
            list.innerHTML = '';
            
            // 建立置頂的按鈕區 (Show All / Hide All)
            const btnRow = document.createElement('div');
            btnRow.className = "flex gap-2 mb-2 pb-2 border-b border-gray-200 sticky top-0 bg-white z-10 p-1";
            
            const showAllBtn = document.createElement('button');
            showAllBtn.className = "flex-1 py-1.5 bg-amber-100 hover:bg-amber-200 text-amber-800 text-xs font-bold rounded transition-colors";
            showAllBtn.innerText = "全顯示";
            
            const hideAllBtn = document.createElement('button');
            hideAllBtn.className = "flex-1 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-bold rounded transition-colors";
            hideAllBtn.innerText = "全隱藏";
            
            btnRow.appendChild(showAllBtn);
            btnRow.appendChild(hideAllBtn);
            list.appendChild(btnRow);

            const slots = player.skeleton.slots.filter(s => s.attachment != null);
            const checkboxes = []; // 存放所有 checkbox 引用，方便全選控制

            slots.forEach(slot => {
                // 記憶原始顏色
                const originalColor = { r: slot.color.r, g: slot.color.g, b: slot.color.b };

                const label = document.createElement('label');
                label.className = "flex items-center gap-2 cursor-pointer hover:bg-red-50 p-1.5 rounded transition-colors group";
                
                const checkbox = document.createElement('input');
                checkbox.type = "checkbox";
                checkbox.checked = slot.color.a > 0;
                checkbox.className = "w-4 h-4 text-amber-500 rounded focus:ring-amber-400 border-gray-300";
                
                checkbox.onchange = (e) => {
                    slot.color.a = e.target.checked ? 1 : 0;
                };
                checkboxes.push({ box: checkbox, slot: slot });

                const span = document.createElement('span');
                span.className = "text-gray-700 font-medium truncate flex-1 group-hover:text-red-600 transition-colors";
                span.innerText = slot.data.name;
                span.title = slot.data.name;

                // 🌟 滑過選單時，部位變成紅色提示
                label.onmouseenter = () => {
                    slot.color.r = 1; slot.color.g = 0; slot.color.b = 0; // 濾鏡變紅
                };
                label.onmouseleave = () => {
                    slot.color.r = originalColor.r; slot.color.g = originalColor.g; slot.color.b = originalColor.b; // 恢復
                };

                label.appendChild(checkbox);
                label.appendChild(span);
                list.appendChild(label);
            });

            // 綁定全顯示與全隱藏事件
            showAllBtn.onclick = () => {
                checkboxes.forEach(item => { item.slot.color.a = 1; item.box.checked = true; });
            };
            hideAllBtn.onclick = () => {
                checkboxes.forEach(item => { item.slot.color.a = 0; item.box.checked = false; });
            };

            if (slots.length === 0) {
                list.innerHTML = '<span class="text-gray-400 text-center py-2">無可用外觀配件</span>';
            }
        }

        // --- 🌟 完美 1:1 攝影機平移與縮放 ---
        function setupCameraControls(canvas, player) {
            canvas.addEventListener('wheel', (e) => {
                e.preventDefault();
                const zoomDelta = e.deltaY < 0 ? 0.1 : -0.1;
                // 限制縮放範圍，保留 0.3 到 4.0 倍
                currentZoom = Math.min(Math.max(currentZoom + zoomDelta, 0.3), 4.0); 
                player.skeleton.scaleX = currentZoom;
                player.skeleton.scaleY = currentZoom;
            }, { passive: false });

            canvas.addEventListener('pointerdown', (e) => {
                isDragging = true;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
                canvas.setPointerCapture(e.pointerId);
            });

            canvas.addEventListener('pointermove', (e) => {
                if (!isDragging || !player.skeleton) return;
                
                const rect = canvas.getBoundingClientRect();
                if (rect.width === 0 || rect.height === 0) return;

                const dx = e.clientX - lastMouseX;
                const dy = e.clientY - lastMouseY;

                // 🌟 使用 Spine 內建自適應計算過的「實際攝影機大小」取代死板的 BASE_VIEWPORT
                // 這樣才能精準換算出：螢幕上的 1 像素 = 世界觀的幾像素，達成完美 1:1！
                const camW = player.viewport.cameraWidth || BASE_VIEWPORT.width;
                const camH = player.viewport.cameraHeight || BASE_VIEWPORT.height;

                const scaleFactorX = camW / rect.width / currentZoom;
                const scaleFactorY = camH / rect.height / currentZoom;

                player.skeleton.x += dx * scaleFactorX;
                player.skeleton.y -= dy * scaleFactorY;

                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            });

            const stopDrag = () => { isDragging = false; };
            canvas.addEventListener('pointerup', stopDrag);
            canvas.addEventListener('pointercancel', stopDrag);
        }

        // 重置為預設的放大 2 倍狀態
        function resetCamera() {
            if (!globalPlayer || !globalPlayer.skeleton) return;
            currentZoom = DEFAULT_ZOOM;
            globalPlayer.skeleton.scaleX = DEFAULT_ZOOM;
            globalPlayer.skeleton.scaleY = DEFAULT_ZOOM;
            globalPlayer.skeleton.x = 0;
            globalPlayer.skeleton.y = 0;
        }
    </script>
</body>
</html>
