<!DOCTYPE html>
<html lang="zh-TW">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <title>嘟嘟臉角色招募模擬器</title>
        <link class="icon" href="https://i.postimg.cc/mkfSTq5k/Favicon.png" type="image/png">
        <script src="data_core.js"></script>
        <script src="data_skills.js"></script>
        <link rel="stylesheet" href="sprites.css">
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = { darkMode: 'class' }
        </script>
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
        <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
        
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@esotericsoftware/spine-player@4.1.23/dist/spine-player.min.css">
        <script src="https://cdn.jsdelivr.net/npm/@esotericsoftware/spine-player@4.1.23/dist/iife/spine-player.min.js"></script>
        <style>
            :root { --user-bg-image: url('https://i.postimg.cc/fTJ36ZFT/CG-Schedule-Rim.png'); }
            body { 
            font-family: 'Noto Sans TC', sans-serif; background-color: #fcf8f2; 
            -webkit-tap-highlight-color: transparent; transition: color 0.3s ease;
            }
            body::before {
            content: ""; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            z-index: -2; background-image: var(--user-bg-image); background-size: cover;
            background-position: center; background-repeat: no-repeat;
            }
            body::after {
            content: ""; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            z-index: -1; background-color: rgba(252, 248, 242, 0.75); transition: background-color 0.3s ease;
            }
            .dark body { color: #e2e8f0; }
            .dark body::after { background-color: rgba(26, 32, 44, 0.85); }
            .rainbow-wrapper {
            position: relative; padding: 3px; border-radius: 12px;
            background: linear-gradient(45deg, #ff0000, #ff7300, #ffeb00, #47e247, #00bbff, #0055ff, #8800ff, #ff0000);
            background-size: 400%; animation: rainbowMove 5s linear infinite;
            display: inline-flex; align-items: center; justify-content: center;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.8));
            }
            .rainbow-content { border-radius: 9px; overflow: visible; width: 100%; height: 100%; }
            @keyframes rainbowMove { 0% { background-position: 0 0; } 100% { background-position: 400% 0; } }
            .char-avatar-container { 
            position: relative; overflow: hidden; transform-origin: center;
            display: flex; align-items: center; justify-content: center;
            }
            .char-avatar-container img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
            @keyframes flashGold {
            0% { filter: brightness(1); }
            50% { filter: brightness(1.5) drop-shadow(0 0 15px gold); transform: scale(1.05); }
            100% { filter: brightness(1); }
            }
            .flash-gold { animation: flashGold 0.5s ease-out forwards; }
            @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            70% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
            }
            .animate-pop { 
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; 
            opacity: 0; 
            }
            @keyframes popInExaggerated {
            0% { transform: scale(0) rotate(-15deg); opacity: 0; }
            50% { transform: scale(1.25) rotate(10deg); opacity: 1; filter: brightness(1.2); }
            75% { transform: scale(0.9) rotate(-5deg); opacity: 1; }
            100% { transform: scale(1.05) rotate(0deg); opacity: 1; }
            }
            .animate-pop-exaggerated { 
            animation: popInExaggerated 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; 
            opacity: 0; 
            }
            .btn-gacha { transition: transform 0.1s; }
            .btn-gacha:active { transform: scale(0.95); }
            .pool-btn { transition: all 0.2s; }
            .pool-btn.active { background-color: #f59e0b; color: white; border-color: #d97706; }
            #backToTop {
            position: fixed; bottom: 20px; right: 20px; z-index: 9999;
            display: none; width: 45px; height: 45px; border-radius: 50%;
            background-color: #fbbf24; color: white; border: none;
            cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s, background-color 0.3s;
            font-size: 20px; display: flex; align-items: center; justify-content: center;
            }
            #backToTop:hover { background-color: #d97706; transform: translateY(-5px); }
        </style>
    </head>
    <body class="p-3 sm:p-6 md:p-8 text-gray-800 dark:text-gray-100">

        <!-- ========================================================== -->
        <!-- 全螢幕轉蛋動畫舞台 -->
        <!-- ========================================================== -->
        <div id="gachaStage" class="fixed inset-0 z-[99999] bg-black hidden flex items-center justify-center select-none">
            <!-- 下層：艾爾芬 (負責接收互動，z-index: 10) -->
            <div id="gachaSpineContainerErpin" class="absolute inset-0 w-full h-full z-10 cursor-pointer"></div>
            
            <!-- 中層：辦公桌與書本 (滑鼠穿透，z-index: 20) -->
            <div id="gachaSpineContainerDocs" class="absolute inset-0 w-full h-full z-20 pointer-events-none"></div>

            <!-- 上層：大頭特寫 (專屬 Spine 容器，預設隱藏，z-index: 30) -->
            <div id="gachaSpineContainerCloseup" class="absolute inset-0 w-full h-full z-30 pointer-events-none hidden bg-black/50"></div>
        </div>
        <!-- ========================================================== -->
        <div class="max-w-4xl mx-auto space-y-6">
            <header class="bg-white/90 dark:bg-gray-800/90 backdrop-blur-md rounded-2xl p-4 sm:p-6 shadow border-2 border-amber-200/80 dark:border-gray-700 flex flex-col sm:flex-row justify-between items-center gap-4">
                <h1 class="text-2xl sm:text-3xl font-bold text-amber-900 dark:text-amber-400 flex items-center gap-2">
                    <div class="sprite-base sprite-common sprite-Title_Rim shrink-0 scale-[0.5] sm:scale-[0.6] origin-left -ml-1"></div>
                    <span class="-ml-2">嘟嘟臉角色招募模擬器</span>
                </h1>
                <button onclick="window.close()" class="px-4 py-1.5 bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 rounded-lg text-sm font-bold transition-colors shrink-0">
                返回記事本
                </button>
            </header>
            <section class="bg-white/90 dark:bg-gray-800/90 backdrop-blur-md rounded-2xl p-4 shadow border-2 border-amber-200/80 dark:border-gray-700">
                <h2 class="text-sm font-bold text-gray-500 dark:text-gray-400 mb-3">📍 選擇招募池</h2>
                <div id="poolButtons" class="flex flex-wrap gap-2 mb-3"></div>
                <div id="personalitySubMenu" class="hidden border-t border-dashed border-gray-300 dark:border-gray-600 pt-3 mt-1">
                    <span class="text-xs font-bold text-gray-500 dark:text-gray-400 mr-2">🔮 指定性格：</span>
                    <div class="inline-flex flex-wrap gap-2" id="personalityButtons"></div>
                </div>
            </section>
            <section class="flex flex-wrap justify-center gap-4 py-4">
                <button onclick="performGacha(1)" class="btn-gacha px-6 py-3 bg-blue-500 hover:bg-blue-600 text-white font-bold rounded-xl shadow-lg border-b-4 border-blue-700 flex items-center gap-2 relative h-[50px]">
                    <div class="absolute left-3 flex items-center justify-center pointer-events-none">
                        <span id="iconGacha1" class="sprite-base sprite-common sprite-Icon_GachaTicketHero scale-[0.4] origin-center"></span>
                    </div>
                    <span class="ml-10">1次招募</span>
                </button>
                <button onclick="performGacha(10)" class="btn-gacha px-6 py-3 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-xl shadow-lg border-b-4 border-amber-700 flex items-center gap-2 relative h-[50px]">
                    <div class="absolute left-3 flex items-center justify-center pointer-events-none">
                        <span id="iconGacha10" class="sprite-base sprite-common sprite-Icon_GachaTicketHero_10 scale-[0.4] origin-center"></span>
                    </div>
                    <span class="ml-10">10次招募</span>
                </button>
            </section>
            <section id="resultArea" class="bg-gradient-to-b from-white/95 to-amber-50/95 dark:from-gray-800/95 dark:to-gray-900/95 backdrop-blur-md rounded-2xl p-6 shadow-xl border-4 border-amber-300 dark:border-gray-600 min-h-[250px] flex flex-col items-center justify-center">
                <p class="text-gray-400 dark:text-gray-500 font-bold mb-2">等待招募中...</p>
            </section>
            <section class="bg-white/90 dark:bg-gray-800/90 backdrop-blur-md rounded-2xl p-4 shadow border-2 border-gray-200/80 dark:border-gray-700">
                <h3 class="text-sm font-bold text-gray-500 dark:text-gray-400 mb-4 border-b border-gray-200 dark:border-gray-700 pb-2">📜 招募紀錄</h3>
                <div id="historyArea" class="space-y-4 max-h-[500px] overflow-y-auto pr-2"></div>
            </section>
        </div>
        <script>
            // ==========================
            // 系統與 Firebase 初始化
            // ==========================
            const firebaseConfig = { apiKey: "AIzaSyDhv8D2pY_0M56UJrDTQw0RGPHA-BkXU8Y", authDomain: "crayon-note.firebaseapp.com", projectId: "crayon-note", storageBucket: "crayon-note.firebasestorage.app", messagingSenderId: "210614088940", appId: "1:210614088940:web:7addbdc7c466eeb05421c9", measurementId: "G-M1EJPE12TE" };
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            const db = firebase.firestore();
            const auth = firebase.auth();
            
            let currentUser = null;
            
            auth.onAuthStateChanged(user => {
                currentUser = user;
                if (user) { loadHistoryFromCloud(); }
            });
            
            function saveHistoryToCloud(record) {
                if (!currentUser) return;
                db.collection("gacha_history").doc(currentUser.uid).update({
                    logs: firebase.firestore.FieldValue.arrayUnion(record)
                }).catch(() => {
                    db.collection("gacha_history").doc(currentUser.uid).set({ logs: [record] });
                });
            }
            
            function loadHistoryFromCloud() {
                if (!currentUser) return;
                db.collection("gacha_history").doc(currentUser.uid).get().then(doc => {
                    if (doc.exists && doc.data().logs) {
                        renderHistory(doc.data().logs);
                    }
                }).catch(err => console.error("讀取歷史紀錄失敗:", err));
            }
            
            // ==========================
            // 資料設定與 UI 初始化
            // ==========================
            let currentPool = { type: 'normal', rateUpChars: [], personality: null, name: '普通招募' };
            const personalities = ["天真", "冷靜", "狂亂", "活潑", "憂鬱"];
            
            const personalityBorderColors = { "天真": "border-green-500", "冷靜": "border-blue-500", "狂亂": "border-red-500", "活潑": "border-yellow-400", "憂鬱": "border-purple-500" };
            const personalityShadows = { 
                "天真": "shadow-[0_0_15px_rgba(34,197,94,0.85)]", 
                "冷靜": "shadow-[0_0_15px_rgba(59,130,246,0.85)]", 
                "狂亂": "shadow-[0_0_15px_rgba(239,68,68,0.85)]", 
                "活潑": "shadow-[0_0_15px_rgba(250,204,21,0.85)]", 
                "憂鬱": "shadow-[0_0_15px_rgba(168,85,247,0.85)]" 
            };
            
            const validChars = INITIAL_DATA.filter(c => !c.releaseDate || new Date(c.releaseDate).getTime() < Date.now()).map(c => {
                let starNum = 1;
                if (typeof GRADE_MAP !== 'undefined' && GRADE_MAP[c.name]) {
                    const parsedStar = parseInt(GRADE_MAP[c.name]);
                    if (!isNaN(parsedStar)) starNum = parsedStar;
                }
                let isEldainChar = false;
                if (typeof ELDAIN_LIST !== 'undefined') {
                    isEldainChar = ELDAIN_LIST.includes(c.name) || (c.name === '羽伊' && ELDAIN_LIST.includes('羽依'));
                }
                return { ...c, star: starNum, isEldain: isEldainChar };
            });
            
            function initUI() {
                const poolBtnContainer = document.getElementById('poolButtons');
                const pBtnContainer = document.getElementById('personalityButtons');
                poolBtnContainer.innerHTML = '';
                pBtnContainer.innerHTML = '';
            
                let currentRateUps = [];
                if (typeof PICKUP_SCHEDULE !== 'undefined') {
                    const now = new Date().getTime();
                    PICKUP_SCHEDULE.forEach(s => {
                        if (now >= new Date(s.start).getTime() && now <= new Date(s.end).getTime()) {
                            currentRateUps.push(...s.chars);
                        }
                    });
                    currentRateUps = [...new Set(currentRateUps)];
                }
            
                let firstBtn = null;
            
                currentRateUps.forEach(charName => {
                    const btn = document.createElement('button');
                    btn.className = 'pool-btn px-3 py-1.5 rounded-lg border-2 border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 font-bold text-sm text-gray-700 dark:text-gray-200';
                    btn.innerText = `🎯 特選招募 - ${charName}`;
                    btn.onclick = () => setPool('rateup', [charName], null, btn.innerText, btn);
                    poolBtnContainer.appendChild(btn);
                    if (!firstBtn) firstBtn = { btn, type: 'rateup', args: [[charName], null, btn.innerText] };
                });
            
                const normalBtn = document.createElement('button');
                normalBtn.className = 'pool-btn px-3 py-1.5 rounded-lg border-2 border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 font-bold text-sm text-gray-700 dark:text-gray-200';
                normalBtn.innerText = `🌟 普通招募`;
                normalBtn.onclick = () => setPool('normal', [], null, normalBtn.innerText, normalBtn);
                poolBtnContainer.appendChild(normalBtn);
                if (!firstBtn) firstBtn = { btn: normalBtn, type: 'normal', args: [[], null, normalBtn.innerText] };
            
                const pPoolBtn = document.createElement('button');
                pPoolBtn.className = 'pool-btn px-3 py-1.5 rounded-lg border-2 border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 font-bold text-sm text-gray-700 dark:text-gray-200';
                pPoolBtn.innerText = `🔮 性格選擇招募`;
                pPoolBtn.onclick = () => {
                    document.getElementById('personalitySubMenu').classList.remove('hidden');
                    setPool('personality', [], personalities[0], `🔮 性格選擇招募 - ${personalities[0]}`, pPoolBtn);
                    updatePersonalityBtns(personalities[0]);
                };
                poolBtnContainer.appendChild(pPoolBtn);
            
                personalities.forEach(p => {
                    const btn = document.createElement('button');
                    btn.className = 'p-sub-btn px-2 py-1 rounded border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-800 text-xs font-bold';
                    btn.innerText = p;
                    btn.onclick = () => {
                        setPool('personality', [], p, `🔮 性格選擇招募 - ${p}`, pPoolBtn);
                        updatePersonalityBtns(p);
                    };
                    pBtnContainer.appendChild(btn);
                });
            
                if (firstBtn) { setPool(firstBtn.type, firstBtn.args[0], firstBtn.args[1], firstBtn.args[2], firstBtn.btn); }
            }
            
            function setPool(type, rateUpChars, personality, poolName, activeElement) {
                currentPool = { type, rateUpChars, personality, name: poolName };
                document.querySelectorAll('.pool-btn').forEach(b => b.classList.remove('active'));
                if (activeElement) activeElement.classList.add('active');
                if (type !== 'personality') document.getElementById('personalitySubMenu').classList.add('hidden');
            
                const icon1 = document.getElementById('iconGacha1');
                const icon10 = document.getElementById('iconGacha10');
            
                if (icon1 && icon10) {
                    if (type === 'personality') {
                        icon1.className = "sprite-base sprite-common sprite-Icon_GachaPersonality scale-[0.4] origin-center";
                        icon10.className = "sprite-base sprite-common sprite-Icon_GachaPersonality_10 scale-[0.4] origin-center";
                    } else {
                        icon1.className = "sprite-base sprite-common sprite-Icon_GachaTicketHero scale-[0.4] origin-center";
                        icon10.className = "sprite-base sprite-common sprite-Icon_GachaTicketHero_10 scale-[0.4] origin-center";
                    }
                }
            }
            
            function updatePersonalityBtns(selectedP) {
                document.querySelectorAll('.p-sub-btn').forEach(b => {
                    if(b.innerText === selectedP) {
                        b.classList.add('bg-purple-500', 'text-white', 'border-purple-600');
                        b.classList.remove('bg-gray-50', 'text-black', 'dark:bg-gray-800');
                    } else {
                        b.classList.remove('bg-purple-500', 'text-white', 'border-purple-600');
                        b.classList.add('bg-gray-50', 'text-black', 'dark:bg-gray-800');
                    }
                });
            }
            
            // ==========================
            // 核心機率計算引擎
            // ==========================
            function getGachaPool(isGuaranteed) {
                let p1 = isGuaranteed ? 0 : 0.76;
                let p2 = isGuaranteed ? 0.97 : 0.21;
                let p3 = 0.03;
                let eldainBase = 0.00036;
            
                let availableChars = validChars;
                if (currentPool.type === 'personality') {
                    availableChars = validChars.filter(c => c.personality === currentPool.personality);
                }
            
                let stars1 = availableChars.filter(c => c.star === 1);
                let stars2 = availableChars.filter(c => c.star === 2);
                let stars3 = availableChars.filter(c => c.star === 3);
            
                let weightedPool = [];
            
                if (stars1.length > 0) {
                    let w = p1 / stars1.length;
                    stars1.forEach(c => weightedPool.push({ char: c, weight: w, isRateUp: false }));
                }
                if (stars2.length > 0) {
                    let w = p2 / stars2.length;
                    stars2.forEach(c => weightedPool.push({ char: c, weight: w, isRateUp: false }));
                }
            
                if (stars3.length > 0) {
                    let allEldains = stars3.filter(c => c.isEldain);
                    let normal3s = stars3.filter(c => !c.isEldain);
                    
                    if (currentPool.type === 'personality') {
                        let eldainTotalWeight = 0;
                        if (allEldains.length > 0) {
                            eldainTotalWeight = 0.00032; 
                            let w = eldainTotalWeight / allEldains.length;
                            allEldains.forEach(c => weightedPool.push({ char: c, weight: w, isRateUp: false }));
                        }
            
                        let remaining3Prob = p3 - eldainTotalWeight;
                        if (normal3s.length > 0) {
                            let w = remaining3Prob / normal3s.length;
                            normal3s.forEach(c => weightedPool.push({ char: c, weight: w, isRateUp: false }));
                        }
                    } 
                    else {
                        let rateUpEldains = allEldains.filter(c => currentPool.rateUpChars.includes(c.name));
                        let rateUpNormals = normal3s.filter(c => currentPool.rateUpChars.includes(c.name));
            
                        if (rateUpEldains.length > 0) {
                            let totalEldainProb = allEldains.length * eldainBase;
                            let targetWeight = (totalEldainProb * 2) / rateUpEldains.length;
                            rateUpEldains.forEach(c => weightedPool.push({ char: c, weight: targetWeight, isRateUp: true }));
                        } else {
                            allEldains.forEach(c => weightedPool.push({ char: c, weight: eldainBase, isRateUp: false }));
                        }
            
                        let currentTotal3Weight = weightedPool.filter(p => p.char.star === 3).reduce((sum, p) => sum + p.weight, 0);
                        let remaining3Prob = p3 - currentTotal3Weight;
            
                        if (normal3s.length > 0) {
                            if (rateUpNormals.length > 0) {
                                let baseNormalWeight = remaining3Prob / normal3s.length;
                                let targetRateUpWeight = baseNormalWeight * 2;
                                let totalRateUpWeight = targetRateUpWeight * rateUpNormals.length;
                                let otherNormalWeight = Math.max(0, (remaining3Prob - totalRateUpWeight) / (normal3s.length - rateUpNormals.length));
            
                                normal3s.forEach(c => {
                                    if (currentPool.rateUpChars.includes(c.name)) {
                                        weightedPool.push({ char: c, weight: targetRateUpWeight, isRateUp: true });
                                    } else {
                                        weightedPool.push({ char: c, weight: otherNormalWeight, isRateUp: false });
                                    }
                                });
                            } else {
                                let w = remaining3Prob / normal3s.length;
                                normal3s.forEach(c => weightedPool.push({ char: c, weight: w, isRateUp: false }));
                            }
                        }
                    }
                }
                return weightedPool;
            }
            
            function pullOne(isGuaranteed) {
                const pool = getGachaPool(isGuaranteed);
                const rand = Math.random();
                let accum = 0;
                for (let i = 0; i < pool.length; i++) {
                    accum += pool[i].weight;
                    if (rand <= accum) return pool[i];
                }
                return pool[pool.length - 1];
            }

            let pendingGachaTimes = 0; 
            let pendingGachaResults = [];
            let has3Star = false;
            let has2Star = false;
            let hasRateUp = false; // 🆕 新增：用來記錄有沒有抽到特選 Pickup 角色

            function performGacha(times) {
                pendingGachaTimes = times;
                pendingGachaResults = [];
                has3Star = false;
                has2Star = false;
                hasRateUp = false; // 🆕 每次抽卡重置狀態
                
                for (let i = 0; i < times; i++) {
                    let isGuaranteed = (times === 10 && i === 9);
                    let result = pullOne(isGuaranteed);
                    pendingGachaResults.push(result);
                    
                    if (result.char.star === 3) has3Star = true;
                    if (result.char.star === 2) has2Star = true;
                    if (result.isRateUp) hasRateUp = true; // 🆕 如果這隻是當期特選，標記為 true
                }
                startGachaAnimation();
            }

            // 動畫全數播完後，秀出結果
            function showRealGachaResults() {
                renderResultArea(pendingGachaResults);
                addToHistory(pendingGachaResults, currentPool.name);
                document.getElementById('resultArea').scrollIntoView({ behavior: 'smooth' });
            }

            // ==========================================================
            // 💡 Spine 視角與對齊配置中心
            // ==========================================================
            const SPINE_CONFIG = {
                viewport: {
                    // 💡 如果你發現窗戶還是被卡掉，請把 width 和 height 同比例加大 (如 2000, 1125)
                    // 💡 如果艾爾芬太偏右，把 x 調小 (如 -1000)
                    // 💡 如果艾爾芬太高(飛在空中)，把 y 往正數調 (如 0 或 100)
                    x: -900,       
                    y: -100,       
                    width: 1800,   
                    height: 1012   // 16:9 比例 (1800 * 9 / 16)
                }
            };

            const GachaState = { INIT: 0, ERPIN_IDLE: 1, DOCUMENTS_DROP: 2, ERPIN_REACTION: 3, CLOSEUP: 4, SHOW_RESULT: 5 };
            let currentGachaState = GachaState.INIT;
            
            let gachaPlayerErpin = null;
            let gachaPlayerDocs = null;
            let gachaPlayerCloseup = null;

            function startGachaAnimation() {
                document.getElementById('gachaStage').classList.remove('hidden');
                document.getElementById('gachaSpineContainerErpin').classList.remove('hidden');
                document.getElementById('gachaSpineContainerDocs').classList.remove('hidden');
                document.getElementById('gachaSpineContainerCloseup').classList.add('hidden');
                
                initSpineStages();
            }

            function initSpineStages() {
                currentGachaState = GachaState.ERPIN_IDLE;
                
                if (gachaPlayerErpin) { gachaPlayerErpin.dispose(); gachaPlayerErpin = null; }
                if (gachaPlayerDocs) { gachaPlayerDocs.dispose(); gachaPlayerDocs = null; }
                if (gachaPlayerCloseup) { gachaPlayerCloseup.dispose(); gachaPlayerCloseup = null; }

                const vp = SPINE_CONFIG.viewport;

                // 🆕 根據是否抽到特選角色，決定榮春（Choon）要不要開燈登場
                let targetErpinSkin = hasRateUp ? "Choon_On" : "Choon_Off";

                // 1. 載入艾爾芬
                gachaPlayerErpin = new spine.SpinePlayer(document.getElementById('gachaSpineContainerErpin'), {
                    skelUrl: `./gacha/Gacha_Hero_Erpin.skel.bytes`, 
                    atlasUrl: `./gacha/Gacha_Hero_Erpin.atlas.txt`,
                    animation: "Idle", 
                    skin: targetErpinSkin, // 🆕 將寫死的 "Choon_On" 換成動態變數 targetErpinSkin
                    premultipliedAlpha: true, backgroundColor: "#00000000", alpha: true, showControls: false, showLoading: false,
                    viewport: { x: vp.x, y: vp.y, width: vp.width, height: vp.height },
                    success: function (player) { 
                        // 強制打開背景與窗戶的插槽
                        try { player.skeleton.setAttachment("BG", "BG"); } catch(e) {}
                        try { player.skeleton.setAttachment("BG_Window", "BG_Window"); } catch(e) {}
                        
                        setupCheekDragInteraction(player); 
                    }
                });

                // 2. 載入辦公桌與書本
                gachaPlayerDocs = new spine.SpinePlayer(document.getElementById('gachaSpineContainerDocs'), {
                    skelUrl: `./gacha/Gacha_Hero_Documents.skel.bytes`,
                    atlasUrl: `./gacha/Gacha_Hero_Documents.atlas.txt`,
                    animation: "Idle", 
                    premultipliedAlpha: true, backgroundColor: "#00000000", alpha: true, showControls: false, showLoading: false,
                    viewport: { x: vp.x, y: vp.y, width: vp.width, height: vp.height }
                });
                
                // 3. 大頭特寫 Spine
                gachaPlayerCloseup = new spine.SpinePlayer(document.getElementById('gachaSpineContainerCloseup'), {
                    skelUrl: `./gacha/Gacha_Hero_Closeup.skel.bytes`,
                    atlasUrl: `./gacha/Gacha_Hero_Closeup.atlas.txt`,
                    premultipliedAlpha: true, backgroundColor: "#00000000", alpha: true, showControls: false, showLoading: false
                });
            }

            function triggerDocumentsDrop() {
                currentGachaState = GachaState.DOCUMENTS_DROP;
                
                // 動畫名稱 (預設播一般的 Drop_1 或 Drop_10_1 即可，發光效果由下方插槽控制)
                let dropAnimName = (pendingGachaTimes === 1) ? "Drop_1" : "Drop_10_1";
                let dropEndAnimName = (pendingGachaTimes === 1) ? "Drop_1_End" : "Drop_10_1_End";
                
                if (gachaPlayerDocs) {
                    gachaPlayerDocs.animationState.setAnimation(0, dropAnimName, false);
                    
                    // 🌟 核心魔法：劫持渲染週期，精準替換第 N 本書為 3 星發光書！
                    // (因為 Spine 動畫播放時可能會不斷重置圖層，所以我們要在 update 裡面強制鎖定它)
                    const origDocsUpdate = gachaPlayerDocs.skeleton.updateWorldTransform;
                    gachaPlayerDocs.skeleton.updateWorldTransform = function () {
                        origDocsUpdate.call(this); // 先執行原本的動畫
                        
                        if (pendingGachaTimes === 10) {
                            // 遍歷 10 抽結果，如果第 idx 個角色是 3 星，就把對應的書換成彩色書
                            pendingGachaResults.forEach((result, idx) => {
                                if (result.char.star === 3) {
                                    let bookIdx = idx + 1; // 書本編號 1~10
                                    try { 
                                        this.setAttachment(`Book_Drop_${bookIdx}`, `Book_Drop_${bookIdx}_3star`); 
                                    } catch(e) {}
                                }
                            });
                        } else {
                            // 單抽如果是 3 星
                            if (pendingGachaResults[0].char.star === 3) {
                                try { this.setAttachment(`Book_Drop_1`, `Book_Drop_1_3star`); } catch(e) {}
                            }
                        }
                    };

                    gachaPlayerDocs.animationState.addListener({
                        complete: function(entry) { 
                            if (entry.animation.name === dropAnimName) {
                                gachaPlayerDocs.animationState.setAnimation(0, dropEndAnimName, true);
                                triggerErpinReaction();
                            }
                        }
                    });
                } else {
                    triggerErpinReaction();
                }
            }

            function triggerErpinReaction() {
                currentGachaState = GachaState.ERPIN_REACTION;
                
                // 🌟 根據星數決定艾爾芬的反應！
                let reactionAnimName = "End_1";
                if (has3Star) reactionAnimName = "End_3";       // 3星終極驚訝
                else if (has2Star) reactionAnimName = "End_2";  // 2星驚訝

                if (gachaPlayerErpin) {
                    gachaPlayerErpin.animationState.setAnimation(0, reactionAnimName, false);
                    gachaPlayerErpin.animationState.addListener({
                        complete: function(entry) {
                            if (entry.animation.name === reactionAnimName) {
                                triggerCloseupSpine(); // 播完縮放反應後，進入大頭 Spine
                            }
                        }
                    });
                } else {
                    triggerCloseupSpine();
                }
            }

            function triggerCloseupSpine() {
                currentGachaState = GachaState.CLOSEUP;
                
                const closeupBox = document.getElementById('gachaSpineContainerCloseup');
                closeupBox.classList.remove('hidden');
                
                // 將後方已經播完的艾爾芬與桌子隱藏，避免穿幫
                document.getElementById('gachaSpineContainerErpin').classList.add('hidden');
                document.getElementById('gachaSpineContainerDocs').classList.add('hidden');
                
                if (gachaPlayerCloseup && gachaPlayerCloseup.skeleton.data.animations.length > 0) {
                    // 自動抓取大頭 Spine 的第一個動作來播放 (防呆機制)
                    let animName = gachaPlayerCloseup.skeleton.data.animations[0].name;
                    
                    gachaPlayerCloseup.animationState.setAnimation(0, animName, false);
                    gachaPlayerCloseup.animationState.addListener({
                        complete: function(entry) {
                            if (entry.animation.name === animName) {
                                finishGachaAnimation();
                            }
                        }
                    });
                } else {
                    // 防呆：如果特寫載入失敗，2秒後直接出結果
                    setTimeout(finishGachaAnimation, 2000);
                }
            }

            function finishGachaAnimation() {
                currentGachaState = GachaState.SHOW_RESULT;
                document.getElementById('gachaStage').classList.add('hidden');
                
                if (gachaPlayerErpin) { gachaPlayerErpin.dispose(); gachaPlayerErpin = null; }
                if (gachaPlayerDocs) { gachaPlayerDocs.dispose(); gachaPlayerDocs = null; }
                if (gachaPlayerCloseup) { gachaPlayerCloseup.dispose(); gachaPlayerCloseup = null; }
                
                // 🌟 動畫播完，秀出剛剛已經偷抽好的結果！
                showRealGachaResults();
            }

            function setupCheekDragInteraction(player) {
                const canvas = document.querySelector('#gachaSpineContainerErpin canvas');
                if (!canvas) return;
                canvas.style.touchAction = 'none';

                let activeInteractBone = null;
                let initialBoneX = 0, initialBoneY = 0;
                let initialBoneWorldX = 0, initialBoneWorldY = 0;
                let isDragging = false;
                let startX = 0, startY = 0, lastMouseX = 0, lastMouseY = 0, dragDistance = 0;
                let hasTriggeredPull = false;

                player._customDragTargetX = null; player._customDragTargetY = null;
                player._bouncingBone = null; player._bounceX = null; player._bounceY = null;

                const origUpdateWorldTransform = player.skeleton.updateWorldTransform;
                player.skeleton.updateWorldTransform = function () {
                    if (activeInteractBone && player._customDragTargetX !== null) {
                        activeInteractBone.x = player._customDragTargetX;
                        activeInteractBone.y = player._customDragTargetY;
                    } else if (player._bouncingBone) {
                        player._bouncingBone.x = player._bounceX;
                        player._bouncingBone.y = player._bounceY;
                    }
                    origUpdateWorldTransform.call(this);
                };

                function checkHitCheek(mouseX, mouseY) {
                    const rect = canvas.getBoundingClientRect();
                    const camera = player.camera || (player.sceneRenderer && player.sceneRenderer.camera);
                    let camX = camera ? camera.position.x - (camera.viewportWidth * camera.zoom) / 2 : SPINE_CONFIG.viewport.x;
                    let camY = camera ? camera.position.y - (camera.viewportHeight * camera.zoom) / 2 : SPINE_CONFIG.viewport.y;
                    let camW = camera ? camera.viewportWidth * camera.zoom : SPINE_CONFIG.viewport.width;
                    let camH = camera ? camera.viewportHeight * camera.zoom : SPINE_CONFIG.viewport.height;

                    const bone = player.skeleton.findBone("Character_Ball_Move");
                    if (bone) {
                        const boneCanvasX = ((bone.worldX - camX) / camW) * rect.width;
                        const boneCanvasY = rect.height - ((bone.worldY - camY) / camH) * rect.height;
                        if (Math.hypot(mouseX - boneCanvasX, mouseY - boneCanvasY) < 150) return bone;
                    }
                    return null;
                }

                canvas.addEventListener('pointerdown', (e) => {
                    if (currentGachaState !== GachaState.ERPIN_IDLE) return;
                    const rect = canvas.getBoundingClientRect();
                    const hitBone = checkHitCheek(e.clientX - rect.left, e.clientY - rect.top);
                    if (hitBone) {
                        isDragging = true; activeInteractBone = hitBone;
                        startX = lastMouseX = e.clientX; startY = lastMouseY = e.clientY;
                        dragDistance = 0; hasTriggeredPull = false;
                        initialBoneX = activeInteractBone.x; initialBoneY = activeInteractBone.y;
                        initialBoneWorldX = activeInteractBone.worldX; initialBoneWorldY = activeInteractBone.worldY;
                        canvas.setPointerCapture(e.pointerId);

                        const animNames = player.skeleton.data.animations.map(a => a.name);
                        if (animNames.includes("Touch")) player.animationState.setAnimation(0, "Touch", true);
                    }
                });

                canvas.addEventListener('pointermove', (e) => {
                    if (!isDragging || !player.skeleton || !activeInteractBone) return;
                    const rect = canvas.getBoundingClientRect();
                    const dx = e.clientX - lastMouseX; const dy = e.clientY - lastMouseY;
                    dragDistance += Math.hypot(dx, dy);

                    const camera = player.camera || (player.sceneRenderer && player.sceneRenderer.camera);
                    let camW = camera ? camera.viewportWidth * camera.zoom : SPINE_CONFIG.viewport.width;
                    let camH = camera ? camera.viewportHeight * camera.zoom : SPINE_CONFIG.viewport.height;

                    let worldDx = (e.clientX - startX) * (camW / rect.width) * 1.3;
                    let worldDy = -(e.clientY - startY) * (camH / rect.height) * 1.3;
                    if (worldDx > 0) worldDx *= 0.1;

                    let targetWorld = { x: initialBoneWorldX + worldDx, y: initialBoneWorldY + worldDy };
                    if (activeInteractBone.parent) activeInteractBone.parent.worldToLocal(targetWorld);

                    let localDx = targetWorld.x - initialBoneX; let localDy = targetWorld.y - initialBoneY;
                    let rawDistance = Math.hypot(localDx, localDy);
                    const MAX_RADIUS = 55;
                    if (rawDistance > 0) {
                        let elasticDist = MAX_RADIUS * (1 - Math.exp(-rawDistance / (MAX_RADIUS * 1.2)));
                        localDx = (localDx / rawDistance) * elasticDist; localDy = (localDy / rawDistance) * elasticDist;
                    }
                    player._customDragTargetX = initialBoneX + localDx; player._customDragTargetY = initialBoneY + localDy;
                    
                    if (dragDistance > 30) hasTriggeredPull = true;
                    lastMouseX = e.clientX; lastMouseY = e.clientY;
                });

                const stopDrag = (e) => {
                    if (!isDragging) return; isDragging = false;
                    player._bouncingBone = activeInteractBone;
                    player._bounceX = player._customDragTargetX !== null ? player._customDragTargetX : initialBoneX;
                    player._bounceY = player._customDragTargetY !== null ? player._customDragTargetY : initialBoneY;
                    activeInteractBone = null; player._customDragTargetX = null; player._customDragTargetY = null;

                    let targetX = initialBoneX, targetY = initialBoneY;
                    let velX = 0, velY = 0; const tension = 0.20, friction = 0.85;
                    function applyBounce() {
                        if (!player._bouncingBone) return;
                        let dx = targetX - player._bounceX; let dy = targetY - player._bounceY;
                        velX += dx * tension; velY += dy * tension; velX *= friction; velY *= friction;
                        player._bounceX += velX; player._bounceY += velY;
                        if (Math.abs(dx) > 0.1 || Math.abs(velX) > 0.1 || Math.abs(dy) > 0.1 || Math.abs(velY) > 0.1) {
                            requestAnimationFrame(applyBounce);
                        } else {
                            player._bounceX = targetX; player._bounceY = targetY; player._bouncingBone = null;
                            if (hasTriggeredPull) { triggerDocumentsDrop(); } 
                            else { player.animationState.setAnimation(0, "Idle", true); }
                        }
                    }
                    applyBounce();
                };
                canvas.addEventListener('pointerup', stopDrag);
                canvas.addEventListener('pointercancel', stopDrag);
            }
        </script>
        <button id="backToTop" onclick="scrollToTop()" title="回頂部">
        ▲
        </button>
    </body>
