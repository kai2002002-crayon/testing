            .rainbow-wrapper {
            position: relative; padding: 3px; border-radius: 12px;
            background: linear-gradient(45deg, #ff0000, #ff7300, #ffeb00, #47e247, #00bbff, #0055ff, #8800ff, #ff0000);

            @keyframes popIn {

            .animate-pop {

            .animate-pop-exaggerated { 
            animation: popInExaggerated 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; 
            opacity: 0; 
            }
            //* 🌟 3星書本躺平式發光特效 */
            /* 🌟 3星書本「墊底」發光光暈 (橢圓形放射，完美模擬打在桌面上的光) */
            /* 🌟 3星書本「墊底」發光光暈 (強化版) */
            .book-star-glow {
            position: absolute;
            width: 200px;  /* 🌟 加大尺寸，確保光暈範圍超出書本 */
            height: 100px; /* 🌟 加大尺寸 */
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 28;   /* 🌟 直接在這裡鎖定層級 */

            /* 🌟 移除 mix-blend-mode: screen，避免被 WebGL 畫布吃掉透明度 */
            /* 改用高純度白光與金光直接硬疊 */
            background: radial-gradient(ellipse at center, 
            rgba(255, 255, 255, 1) 0%, 
            rgba(255, 215, 0, 0.95) 25%, 
            rgba(255, 100, 200, 0.6) 55%, 
            rgba(0, 200, 255, 0) 80%);

            @keyframes pulseBookSurround {
            0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.9; }

            /* 🌟 大頭檯面發光容器 (加高高度，讓光能往上暈染) */
            .table-glow-container {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 75%;
            overflow: hidden; pointer-events: none;

                <section id="resultArea" class="absolute inset-0 w-full h-full bg-gradient-to-b from-white/95 to-amber-50/95 dark:from-gray-800/95 dark:to-gray-900/95 backdrop-blur-md p-6 flex flex-col items-center justify-start overflow-y-auto transition-opacity duration-500 z-20">
                    <div class="h-full w-full flex items-center justify-center min-h-[250px]">

            <section class="bg-white/90 dark:bg-gray-800/90 backdrop-blur-md rounded-2xl p-4 shadow border-2 border-gray-200/80 dark:border-gray-700">
                <h3 class="text-sm font-bold text-gray-500 dark:text-gray-400 mb-4 border-b border-gray-200 dark:border-gray-700 pb-2">📜 招募紀錄</h3>
                <div id="historyArea" class="space-y-4 max-h-[500px] overflow-y-auto pr-2"></div>
            </section>

        <script>
            // ==========================
            // 系統與 Firebase 初始化
            // ==========================
            const firebaseConfig = { apiKey: "AIzaSyDhv8D2pY_0M56UJrDTQw0RGPHA-BkXU8Y", authDomain: "crayon-note.firebaseapp.com", projectId: "crayon-note", storageBucket: "crayon-note.firebasestorage.app", messagingSenderId: "210614088940", appId: "1:210614088940:web:7addbdc7c466eeb05421c9", measurementId: "G-M1EJPE12TE" };
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            const db = firebase.firestore();
            const auth = firebase.auth();
            
            let currentUser = null;
            
            auth.onAuthStateChanged(user => {
                currentUser = user;
                if (user) { loadHistoryFromCloud(); }
            });
            
            function saveHistoryToCloud(record) {
                if (!currentUser) return;
                db.collection("gacha_history").doc(currentUser.uid).update({
                    logs: firebase.firestore.FieldValue.arrayUnion(record)
                }).catch(() => {
                    db.collection("gacha_history").doc(currentUser.uid).set({ logs: [record] });
                });
            }
            
            function loadHistoryFromCloud() {
                if (!currentUser) return;
                db.collection("gacha_history").doc(currentUser.uid).get().then(doc => {
                    if (doc.exists && doc.data().logs) {
                        renderHistory(doc.data().logs);
                    }
                }).catch(err => console.error("讀取歷史紀錄失敗:", err));
            }
            
            // ==========================
            // 資料設定與 UI 初始化
            // ==========================
            let currentPool = { type: 'normal', rateUpChars: [], personality: null, name: '普通招募' };
            const personalities = ["天真", "冷靜", "狂亂", "活潑", "憂鬱"];
            
            const personalityBorderColors = { "天真": "border-green-500", "冷靜": "border-blue-500", "狂亂": "border-red-500", "活潑": "border-yellow-400", "憂鬱": "border-purple-500" };
            const personalityShadows = { 
                "天真": "shadow-[0_0_15px_rgba(34,197,94,0.85)]", 
                "冷靜": "shadow-[0_0_15px_rgba(59,130,246,0.85)]", 
                "狂亂": "shadow-[0_0_15px_rgba(239,68,68,0.85)]", 
                "活潑": "shadow-[0_0_15px_rgba(250,204,21,0.85)]", 
                "憂鬱": "shadow-[0_0_15px_rgba(168,85,247,0.85)]" 
            };
            
            const validChars = INITIAL_DATA.filter(c => !c.releaseDate || new Date(c.releaseDate).getTime() < Date.now()).map(c => {
                let starNum = 1;
                if (typeof GRADE_MAP !== 'undefined' && GRADE_MAP[c.name]) {
                    const parsedStar = parseInt(GRADE_MAP[c.name]);
                    if (!isNaN(parsedStar)) starNum = parsedStar;
                }
                let isEldainChar = false;
                if (typeof ELDAIN_LIST !== 'undefined') {
                    isEldainChar = ELDAIN_LIST.includes(c.name) || (c.name === '羽伊' && ELDAIN_LIST.includes('羽依'));
                }
                return { ...c, star: starNum, isEldain: isEldainChar };
            });
            
            function initUI() {
                const poolBtnContainer = document.getElementById('poolButtons');
                const pBtnContainer = document.getElementById('personalityButtons');
                poolBtnContainer.innerHTML = '';
                pBtnContainer.innerHTML = '';
            
                let currentRateUps = [];
                if (typeof PICKUP_SCHEDULE !== 'undefined') {
                    const now = new Date().getTime();
                    PICKUP_SCHEDULE.forEach(s => {
                        if (now >= new Date(s.start).getTime() && now <= new Date(s.end).getTime()) {
                            currentRateUps.push(...s.chars);
                        }
                    });
                    currentRateUps = [...new Set(currentRateUps)];
                }
            
                let firstBtn = null;
            
                currentRateUps.forEach(charName => {
                    const btn = document.createElement('button');
                    btn.className = 'pool-btn px-3 py-1.5 rounded-lg border-2 border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 font-bold text-sm text-gray-700 dark:text-gray-200';
                    btn.innerText = `🎯 特選招募 - ${charName}`;
                    btn.onclick = () => setPool('rateup', [charName], null, btn.innerText, btn);
                    poolBtnContainer.appendChild(btn);
                    if (!firstBtn) firstBtn = { btn, type: 'rateup', args: [[charName], null, btn.innerText] };
                });
            
                const normalBtn = document.createElement('button');
                normalBtn.className = 'pool-btn px-3 py-1.5 rounded-lg border-2 border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 font-bold text-sm text-gray-700 dark:text-gray-200';
                normalBtn.innerText = `🌟 普通招募`;
                normalBtn.onclick = () => setPool('normal', [], null, normalBtn.innerText, normalBtn);
                poolBtnContainer.appendChild(normalBtn);
                if (!firstBtn) firstBtn = { btn: normalBtn, type: 'normal', args: [[], null, normalBtn.innerText] };
            
                const pPoolBtn = document.createElement('button');
                pPoolBtn.className = 'pool-btn px-3 py-1.5 rounded-lg border-2 border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 font-bold text-sm text-gray-700 dark:text-gray-200';
                pPoolBtn.innerText = `🔮 性格選擇招募`;
                pPoolBtn.onclick = () => {
                    document.getElementById('personalitySubMenu').classList.remove('hidden');
                    setPool('personality', [], personalities[0], `🔮 性格選擇招募 - ${personalities[0]}`, pPoolBtn);
                    updatePersonalityBtns(personalities[0]);
                };
                poolBtnContainer.appendChild(pPoolBtn);
            
                personalities.forEach(p => {
                    const btn = document.createElement('button');
                    btn.className = 'p-sub-btn px-2 py-1 rounded border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-800 text-xs font-bold';
                    btn.innerText = p;
                    btn.onclick = () => {
                        setPool('personality', [], p, `🔮 性格選擇招募 - ${p}`, pPoolBtn);
                        updatePersonalityBtns(p);
                    };
                    pBtnContainer.appendChild(btn);
                });
            
                if (firstBtn) { setPool(firstBtn.type, firstBtn.args[0], firstBtn.args[1], firstBtn.args[2], firstBtn.btn); }
            }
            
            function setPool(type, rateUpChars, personality, poolName, activeElement) {
                currentPool = { type, rateUpChars, personality, name: poolName };
                document.querySelectorAll('.pool-btn').forEach(b => b.classList.remove('active'));
                if (activeElement) activeElement.classList.add('active');
                if (type !== 'personality') document.getElementById('personalitySubMenu').classList.add('hidden');
            
                const icon1 = document.getElementById('iconGacha1');
                const icon10 = document.getElementById('iconGacha10');
            
                if (icon1 && icon10) {
                    if (type === 'personality') {
                        icon1.className = "sprite-base sprite-common sprite-Icon_GachaPersonality scale-[0.4] origin-center";
                        icon10.className = "sprite-base sprite-common sprite-Icon_GachaPersonality_10 scale-[0.4] origin-center";
                    } else {
                        icon1.className = "sprite-base sprite-common sprite-Icon_GachaTicketHero scale-[0.4] origin-center";
                        icon10.className = "sprite-base sprite-common sprite-Icon_GachaTicketHero_10 scale-[0.4] origin-center";
                    }
                }
            }
            
            function updatePersonalityBtns(selectedP) {
                document.querySelectorAll('.p-sub-btn').forEach(b => {
                    if(b.innerText === selectedP) {
                        b.classList.add('bg-purple-500', 'text-white', 'border-purple-600');
                        b.classList.remove('bg-gray-50', 'text-black', 'dark:bg-gray-800');
                    } else {
                        b.classList.remove('bg-purple-500', 'text-white', 'border-purple-600');
                        b.classList.add('bg-gray-50', 'text-black', 'dark:bg-gray-800');
                    }
                });
            }
            
            // ==========================
            // 核心機率計算引擎
            // ==========================
            function getGachaPool(isGuaranteed) {
                let p1 = isGuaranteed ? 0 : 0.76;
                let p2 = isGuaranteed ? 0.97 : 0.21;
                let p3 = 0.03;
                let eldainBase = 0.00036;
            
                let availableChars = validChars;
                if (currentPool.type === 'personality') {
                    availableChars = validChars.filter(c => c.personality === currentPool.personality);
                }
            
                let stars1 = availableChars.filter(c => c.star === 1);
                let stars2 = availableChars.filter(c => c.star === 2);
                let stars3 = availableChars.filter(c => c.star === 3);
            
                let weightedPool = [];
            
                if (stars1.length > 0) {
                    let w = p1 / stars1.length;
                    stars1.forEach(c => weightedPool.push({ char: c, weight: w, isRateUp: false }));
                }
                if (stars2.length > 0) {
                    let w = p2 / stars2.length;
                    stars2.forEach(c => weightedPool.push({ char: c, weight: w, isRateUp: false }));
                }
            
                if (stars3.length > 0) {
                    let allEldains = stars3.filter(c => c.isEldain);
                    let normal3s = stars3.filter(c => !c.isEldain);
                    
                    if (currentPool.type === 'personality') {
                        let eldainTotalWeight = 0;
                        if (allEldains.length > 0) {
                            eldainTotalWeight = 0.00032; 
                            let w = eldainTotalWeight / allEldains.length;
                            allEldains.forEach(c => weightedPool.push({ char: c, weight: w, isRateUp: false }));
                        }
            
                        let remaining3Prob = p3 - eldainTotalWeight;
                        if (normal3s.length > 0) {
                            let w = remaining3Prob / normal3s.length;
                            normal3s.forEach(c => weightedPool.push({ char: c, weight: w, isRateUp: false }));
                        }
                    } 
                    else {
                        let rateUpEldains = allEldains.filter(c => currentPool.rateUpChars.includes(c.name));
                        let rateUpNormals = normal3s.filter(c => currentPool.rateUpChars.includes(c.name));
            
                        if (rateUpEldains.length > 0) {
                            let totalEldainProb = allEldains.length * eldainBase;
                            let targetWeight = (totalEldainProb * 2) / rateUpEldains.length;
                            rateUpEldains.forEach(c => weightedPool.push({ char: c, weight: targetWeight, isRateUp: true }));
                        } else {
                            allEldains.forEach(c => weightedPool.push({ char: c, weight: eldainBase, isRateUp: false }));
                        }
            
                        let currentTotal3Weight = weightedPool.filter(p => p.char.star === 3).reduce((sum, p) => sum + p.weight, 0);
                        let remaining3Prob = p3 - currentTotal3Weight;
            
                        if (normal3s.length > 0) {
                            if (rateUpNormals.length > 0) {
                                let baseNormalWeight = remaining3Prob / normal3s.length;
                                let targetRateUpWeight = baseNormalWeight * 2;
                                let totalRateUpWeight = targetRateUpWeight * rateUpNormals.length;
                                let otherNormalWeight = Math.max(0, (remaining3Prob - totalRateUpWeight) / (normal3s.length - rateUpNormals.length));
            
                                normal3s.forEach(c => {
                                    if (currentPool.rateUpChars.includes(c.name)) {
                                        weightedPool.push({ char: c, weight: targetRateUpWeight, isRateUp: true });
                                    } else {
                                        weightedPool.push({ char: c, weight: otherNormalWeight, isRateUp: false });
                                    }
                                });
                            } else {
                                let w = remaining3Prob / normal3s.length;

            reactionLightTimers.push(t1);
            }
            // 只有 1星時：從頭到尾都不產生計時器，保持不發光！
            
            // 2. 書本掉落收尾
            if (gachaPlayerDocs) {
                    let dropEndAnimName = (pendingGachaTimes === 1) ? "Drop_1_End" : "Drop_10_1_End";
                    gachaPlayerDocs.animationState.setAnimation(0, dropEndAnimName, false);
                }
            
                // 3. 背景 Zoom In 運鏡
                if (gachaPlayerErpin) {
                    gachaPlayerErpin.animationState.setAnimation(0, "End_3", false);
                }
            
                // 🌟 4. 同時開始播放大頭動畫！不再等背景 Zoom 完了！
                let animName = has3Star ? "Idle_3" : (has2Star ? "Idle_2" : "Idle_1");
                if (gachaPlayerCloseup) {
                    gachaPlayerCloseup.animationState.timeScale = 1; // 恢復播放
                    gachaPlayerCloseup.animationState.setAnimation(0, animName, false);
            
                    gachaPlayerCloseup.animationState.clearListeners();
                    
                    // 播完大頭動作就進結算
                    gachaPlayerCloseup.animationState.addListener({
                        complete: function(entry) {
                            if (entry.animation.name === animName) {
                                finishGachaAnimation();
                            }
                        }
                    });
                } else {
                    setTimeout(finishGachaAnimation, 1500); // 備用防卡死
                }
            
                // 🌟 5. 綁定「跳過」的點擊事件，並受控管理
                activeSkipHandler = function() {
                    finishGachaAnimation();
                };
                // 給 300ms 緩衝再綁定，避免玩家剛點螢幕觸發 Zoom 的這一下，直接被誤判成跳過
                setTimeout(() => {
                    stage.addEventListener('click', activeSkipHandler);
                }, 300);
            }
            
                        function finishGachaAnimation() {
            if (currentGachaState === GachaState.SHOW_RESULT) return;
            currentGachaState = GachaState.SHOW_RESULT;
            
            clearTimeout(bookChangeTimer); 
            if (gachaPlayerCloseup && gachaPlayerCloseup.animationState) {
            gachaPlayerCloseup.animationState.timeScale = 0;
            gachaPlayerCloseup.animationState.clearListeners();
            }
            reactionLightTimers.forEach(t => clearTimeout(t));
            reactionLightTimers = [];
            
            const glowLayer = document.getElementById('closeupTableGlow');
            glowLayer.className = 'table-glow-container z-[25]';
            glowLayer.innerHTML = '';
            
            const stage = document.getElementById('gachaStage');
            const resultArea = document.getElementById('resultArea');
            
            if (activeEnd3Handler) { stage.removeEventListener('click', activeEnd3Handler); activeEnd3Handler = null; }
            if (activeSkipHandler) { stage.removeEventListener('click', activeSkipHandler); activeSkipHandler = null; }
            
            // 🌟 動畫結束，顯示結果區塊 (拉回上層)
            stage.classList.remove('opacity-100', 'pointer-events-auto', 'z-20');
            stage.classList.add('opacity-0', 'pointer-events-none', 'z-10');
            
            resultArea.classList.remove('opacity-0', 'pointer-events-none', 'z-10');
            resultArea.classList.add('opacity-100', 'z-20');
            
            showRealGachaResults();
            addToHistory(pendingGachaResults, currentPool.name);
            
            // 🌟 結算完畢，解鎖招募按鈕！
            isGachaRunning = false;
            document.querySelectorAll('.btn-gacha').forEach(btn => {
            btn.classList.remove('opacity-50', 'cursor-not-allowed');
            });
            }
            
            
            function setupCheekDragInteraction(player) {
                const canvas = document.querySelector('#gachaSpineContainerErpin canvas');
                if (!canvas) return;
                canvas.style.touchAction = 'none';
            
                let activeInteractBone = null;
                let initialBoneX = 0, initialBoneY = 0;
                let initialBoneWorldX = 0, initialBoneWorldY = 0;
                let isDragging = false;
                let startX = 0, startY = 0, lastMouseX = 0, lastMouseY = 0, dragDistance = 0;
                let hasTriggeredPull = false;
            
                player._customDragTargetX = null; player._customDragTargetY = null;
                player._bouncingBone = null; player._bounceX = null; player._bounceY = null;
            
                const origUpdateWorldTransform = player.skeleton.updateWorldTransform;
                player.skeleton.updateWorldTransform = function () {
                    if (activeInteractBone && player._customDragTargetX !== null) {
                        activeInteractBone.x = player._customDragTargetX;
                        activeInteractBone.y = player._customDragTargetY;
                    } else if (player._bouncingBone) {
                        player._bouncingBone.x = player._bounceX;
                        player._bouncingBone.y = player._bounceY;
                    }
                    origUpdateWorldTransform.call(this);
                };
            
                function checkHitCheek(mouseX, mouseY) {
                    const rect = canvas.getBoundingClientRect();
                    const camera = player.camera || (player.sceneRenderer && player.sceneRenderer.camera);
                    let camX = camera ? camera.position.x - (camera.viewportWidth * camera.zoom) / 2 : SPINE_CONFIG.viewport.x;
                    let camY = camera ? camera.position.y - (camera.viewportHeight * camera.zoom) / 2 : SPINE_CONFIG.viewport.y;
                    let camW = camera ? camera.viewportWidth * camera.zoom : SPINE_CONFIG.viewport.width;
                    let camH = camera ? camera.viewportHeight * camera.zoom : SPINE_CONFIG.viewport.height;
            
                    const bone = player.skeleton.findBone("Character_Ball_Move");
                    if (bone) {
                        const boneCanvasX = ((bone.worldX - camX) / camW) * rect.width;
                        const boneCanvasY = rect.height - ((bone.worldY - camY) / camH) * rect.height;
                        if (Math.hypot(mouseX - boneCanvasX, mouseY - boneCanvasY) < 150) return bone;
                    }
                    return null;
                }
            
                canvas.addEventListener('pointerdown', (e) => {
                    if (currentGachaState !== GachaState.ERPIN_IDLE) return;
                    const rect = canvas.getBoundingClientRect();
                    const hitBone = checkHitCheek(e.clientX - rect.left, e.clientY - rect.top);
                    if (hitBone) {
                        isDragging = true; activeInteractBone = hitBone;
                        startX = lastMouseX = e.clientX; startY = lastMouseY = e.clientY;
                        dragDistance = 0; hasTriggeredPull = false;
                        initialBoneX = activeInteractBone.x; initialBoneY = activeInteractBone.y;
                        initialBoneWorldX = activeInteractBone.worldX; initialBoneWorldY = activeInteractBone.worldY;
                        canvas.setPointerCapture(e.pointerId);
            
                        const animNames = player.skeleton.data.animations.map(a => a.name);
                        if (animNames.includes("Touch")) player.animationState.setAnimation(0, "Touch", true);
                    }
                });
            
                canvas.addEventListener('pointermove', (e) => {
                    if (!isDragging || !player.skeleton || !activeInteractBone) return;
                    const rect = canvas.getBoundingClientRect();
                    const dx = e.clientX - lastMouseX; const dy = e.clientY - lastMouseY;
                    dragDistance += Math.hypot(dx, dy);
            
                    const camera = player.camera || (player.sceneRenderer && player.sceneRenderer.camera);
                    let camW = camera ? camera.viewportWidth * camera.zoom : SPINE_CONFIG.viewport.width;
                    let camH = camera ? camera.viewportHeight * camera.zoom : SPINE_CONFIG.viewport.height;
            
                    let worldDx = (e.clientX - startX) * (camW / rect.width) * 1.3;
                    let worldDy = -(e.clientY - startY) * (camH / rect.height) * 1.3;
                    if (worldDx > 0) worldDx *= 0.1;
            
                    let targetWorld = { x: initialBoneWorldX + worldDx, y: initialBoneWorldY + worldDy };
                    if (activeInteractBone.parent) activeInteractBone.parent.worldToLocal(targetWorld);
            
                    let localDx = targetWorld.x - initialBoneX; let localDy = targetWorld.y - initialBoneY;
                    let rawDistance = Math.hypot(localDx, localDy);
                    const MAX_RADIUS = 55;
                    if (rawDistance > 0) {
                        let elasticDist = MAX_RADIUS * (1 - Math.exp(-rawDistance / (MAX_RADIUS * 1.2)));
                        localDx = (localDx / rawDistance) * elasticDist; localDy = (localDy / rawDistance) * elasticDist;
                    }
                    player._customDragTargetX = initialBoneX + localDx; player._customDragTargetY = initialBoneY + localDy;
                    
                    if (dragDistance > 30) hasTriggeredPull = true;
                    lastMouseX = e.clientX; lastMouseY = e.clientY;
                });
            
               const stopDrag = (e) => {
                    if (!isDragging) return;
                    isDragging = false;
                    canvas.releasePointerCapture(e.pointerId);
                    
                    // 🌟 關鍵修正：放手那一刻直接觸發流程，不需要等彈跳回彈動畫跑完
                    if (hasTriggeredPull) {
                        triggerDropAndEnd1(); 
                    } else {
                        // 如果只是輕點，沒達成拉扯，才做回彈並回到 Idle
                        player._bouncingBone = activeInteractBone;
                        // ... (這裡保留原本的 applyBounce 邏輯，但它不影響觸發邏輯)
                        player.animationState.setAnimation(0, "Idle", true);
                    }
                    activeInteractBone = null;
                };
                canvas.addEventListener('pointerup', stopDrag);
                canvas.addEventListener('pointercancel', stopDrag);
            }
            
            // ==========================
            // 網頁載入與滾動事件
            // ==========================
            window.addEventListener('load', () => {
                initUI();
            });
            
            window.onscroll = function() {
                const btn = document.getElementById("backToTop");
                if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
                    btn.style.display = "flex";
                } else {
                    btn.style.display = "none";
                }
            };
            
            function scrollToTop() {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        </script>
        <button id="backToTop" onclick="scrollToTop()" title="回頂部">
        ▲
        </button>
    </body>
</html>
