<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>坨坨排行榜生成器</title>
    <!-- 引入你的資料庫與 CSS -->
    <script src="data_config.js"></script>
    <script src="data_core.js"></script>
    <link rel="stylesheet" href="sprites.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="https://i.postimg.cc/mkfSTq5k/Favicon.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- 拖曳功能套件 -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <!-- 截圖匯出套件 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <!-- 🌟 新增：Firebase Firestore 模組引入 -->
    <script type="module">
        // 👉 請確保這裡的路徑正確指向你的 firebase_config.js
        import { db } from './firebase_config.js'; 
        import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        window.fetchCharactersFromFirestore = async function() {
            try {
                // 1. 改為讀取 global_characters 集合
                const querySnapshot = await getDocs(collection(db, "global_characters"));
                let chars = [];
                
                querySnapshot.forEach(doc => {
                    const data = doc.data();
                    
                    // 2. 將 core 底下的欄位攤平，適應原本介面的讀取格式
                    chars.push({
                        id: doc.id,                               // 文件 ID (spine name)
                        name: data.core?.name || doc.id,          // 預設名字
                        personality: data.core?.personality || "",// 性格
                        race: data.core?.race || "unknown",       // 種族
                        names: data.names || {},                  // 翻譯 (en, ja, zh-TW)
                        spine: data.spineName || doc.id           // Spine 檔名
                    });
                });
                return chars;
            } catch (error) {
                console.error("Firestore 讀取失敗:", error);
                return [];
            }
        };

        // DOM 載入後啟動
        window.addEventListener('DOMContentLoaded', () => {
            if (window.startApp) window.startApp();
        });
    </script>

    <script>
        tailwind.config = { darkMode: 'class', }
        const isDarkMode = localStorage.getItem('theme') === 'dark' || 
                           (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDarkMode) { document.documentElement.classList.add('dark'); }
    </script>
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; }
        
        /* 滾動條美化 */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background-color: #475569; }

        /* 排行榜截圖時，隱藏設定按鈕 */
        .exporting .hide-on-export { display: none !important; }
        
        /* 確保截圖時背景色正確 */
        .tier-board { background-color: #1e293b; border-radius: 12px; overflow: hidden; }

        /* 顏色選擇器美化 */
        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            padding: 0;
            overflow: hidden;
        }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: none; border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); }

        /* 開合動畫設定 */
        .collapsible-content { transition: max-height 0.3s ease-out, opacity 0.3s ease-out; overflow: hidden; }
        .collapsed { max-height: 0; opacity: 0; margin-top: 0 !important; overflow: hidden; padding-top: 0; padding-bottom: 0; border: none; }
        
        /* 🌟 雙面性格專用：外框呼吸流動與發光 */
        @keyframes dualColorPulse {
            0% { border-color: var(--c1); box-shadow: 0 0 6px var(--c1); }
            50% { border-color: var(--c2); box-shadow: 0 0 6px var(--c2); }
            100% { border-color: var(--c1); box-shadow: 0 0 6px var(--c1); }
        }
        .dual-border-anim {
            --c1: #c084fc; 
            --c2: #4ade80; 
            animation: dualColorPulse 3s ease-in-out infinite;
        }
        /* 🌟 5色綜合流動 (專門用於雙面性格的分類標題) */
        @keyframes pentaColorPulse {
            0% { border-color: #4ade80; box-shadow: 0 0 6px #4ade80; }
            20% { border-color: #60a5fa; box-shadow: 0 0 6px #60a5fa; }
            40% { border-color: #f87171; box-shadow: 0 0 6px #f87171; }
            60% { border-color: #facc15; box-shadow: 0 0 6px #facc15; }
            80% { border-color: #c084fc; box-shadow: 0 0 6px #c084fc; }
            100% { border-color: #4ade80; box-shadow: 0 0 6px #4ade80; }
        }
        .penta-border-anim { animation: pentaColorPulse 5s ease-in-out infinite; }
        
        /* 🌟 專門給分類標題用的無陰影邊框流動 */
        @keyframes pentaBorderNoShadow {
            0% { border-left-color: #4ade80; }
            20% { border-left-color: #60a5fa; }
            40% { border-left-color: #f87171; }
            60% { border-left-color: #facc15; }
            80% { border-left-color: #c084fc; }
            100% { border-left-color: #4ade80; }
        }
        .penta-border-title-anim { 
            animation: pentaBorderNoShadow 5s ease-in-out infinite; 
        }
        
        @keyframes pentaTextFlow {
            0% { background-position: 200% center; }
            100% { background-position: 0% center; }
        }
        .penta-text-anim {
            background: linear-gradient(90deg, #4ade80, #60a5fa, #f87171, #facc15, #c084fc, #4ade80);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            animation: pentaTextFlow 4s linear infinite;
        }

        /* 🌟 控制 Rank 區內的圖示放大與名字隱藏 🌟 */
        .tier-dropzone[id^="tier_"] .char-name { display: none !important; }

        .tier-dropzone[id^="tier_"] .char-icon-box {
            width: 4.5rem !important;
            height: 4.5rem !important;
        }
        @media (min-width: 640px) {
            .tier-dropzone[id^="tier_"] .char-icon-box {
                width: 5.25rem !important;
                height: 5.25rem !important;
            }
        }
    </style>
</head>
<body class="p-2 sm:p-6 bg-[#fcf8f2] dark:bg-slate-900 text-gray-800 dark:text-gray-200 min-h-screen transition-colors duration-300">
    <div class="max-w-[1200px] mx-auto space-y-4">
        
        <!-- 頂部控制列 -->
        <header class="bg-white/90 dark:bg-slate-800/90 backdrop-blur-md p-4 rounded-2xl shadow-md border-4 border-amber-400 dark:border-slate-600 flex justify-between items-center relative z-10 flex-wrap gap-2">
            <div>
                <h1 id="pageTitle" class="text-xl sm:text-2xl font-black text-amber-950 dark:text-amber-400 flex items-center gap-2">
                    👑 排行榜生成器
                </h1>
            </div>
            <div class="flex items-center gap-2">
                <button id="btnAddRow" onclick="addTierRow()" class="px-3 py-1.5 bg-green-500 hover:bg-green-600 text-white font-bold rounded-xl shadow transition text-sm">
                    ➕ 新增級別
                </button>
                <button id="btnReset" onclick="resetBoard()" class="px-3 py-1.5 bg-red-500 hover:bg-red-600 text-white font-bold rounded-xl shadow transition text-sm">
                    🗑️ 重置所有
                </button>
                <button id="btnExport" onclick="exportImage()" class="px-3 py-1.5 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-xl shadow transition text-sm flex items-center gap-1">
                    📸 輸出圖片
                </button>
            </div>
        </header>

        <!-- 🌟 排行榜主要截圖區域 🌟 -->
        <div id="captureArea" class="bg-slate-900 p-4 sm:p-6 rounded-2xl shadow-xl border-4 border-slate-700">
            <!-- 標題輸入區 (可編輯) -->
            <input type="text" id="tierTitle" value="我的最愛排行榜" class="w-full bg-transparent text-center text-2xl sm:text-4xl font-black text-white mb-6 outline-none border-b-2 border-transparent hover:border-slate-600 focus:border-amber-400 transition-colors pb-2">
            
            <!-- 級別列容器 -->
            <div id="tierContainer" class="flex flex-col gap-1 border-2 border-slate-950 bg-slate-950 rounded-lg overflow-hidden shadow-inner">
                <!-- Javascript 會在這裡動態插入 Row -->
            </div>
        </div>

        <!-- 🌟 角色選擇池 🌟 -->
        <section class="bg-white/90 dark:bg-slate-800/90 backdrop-blur-md p-4 rounded-2xl shadow-md border border-gray-200 dark:border-slate-700 mt-4">
            <h2 id="poolTitle" class="text-lg font-bold text-gray-900 dark:text-gray-300 mb-3 border-b border-gray-200 dark:border-slate-700 pb-2">👥 角色池 (拖曳至上方排行榜)</h2>
            <div id="characterPool" class="flex flex-col gap-3">
                <!-- Javascript 會在這裡動態插入分類與角色 -->
            </div>
        </section>

    </div>

    <script>
        const HEX_COLORS = {
            "天真": "#4ade80", "冷靜": "#60a5fa", "狂亂": "#f87171", "活潑": "#facc15", "憂鬱": "#c084fc"
        };
        
        const personalityColors = { 
            "天真": "border-green-400 text-green-400", 
            "冷靜": "border-blue-400 text-blue-400", 
            "狂亂": "border-red-400 text-red-400", 
            "活潑": "border-yellow-400 text-yellow-400", 
            "憂鬱": "border-purple-400 text-purple-400",
            "NPC": "border-gray-400 text-gray-400",
            "共鳴": "border-rainbow text-rainbow",
            "雙面": "penta-border-title-anim penta-text-anim"
        };

        const SPRITE_CLASS_MAP = {
            race_龍族: "sprite-Bg_Dragon", race_精靈: "sprite-Bg_Elf", race_妖精: "sprite-Bg_Sprite",
            race_幽靈: "sprite-Bg_Phantom", race_魔靈: "sprite-Bg_Elemental", race_不明: "sprite-Bg_Unknown",
            race_獸人: "sprite-Bg_Werebeast", race_魔女: "sprite-Bg_Witch", race_unknown: "sprite-Bg_Unknown"
        };

        const CHAR_SPRITE_MAP = {
            "共鳴": "sprite-char-resonance",
            "冷靜": "sprite-char-composed", "憂鬱": "sprite-char-depressed",
            "天真": "sprite-char-innocence", "狂亂": "sprite-char-madness", "活潑": "sprite-char-vivacious",
            "NPC": "sprite-char-innocence", 
            "雙面": "sprite-char-multifaceted"
        };

        const NPC_LIST = ['雷內瓦(NPC)', '可愛餅', '高蒂', '榮春'];
        const NPC_SPINE = { "雷內瓦(NPC)": "Renewa", "可愛餅": "Crepe", "高蒂": "Goldy", "榮春": "Youngchun" };
        const NPC_ICON = { "雷內瓦(NPC)": "sprite-RenewaNPC", "可愛餅": "sprite-Crepe", "高蒂": "sprite-Goldy", "榮春": "sprite-Youngchun" };

        const DEFAULT_TIERS = [
            { label: "S", color: "#ef4444" },
            { label: "A", color: "#f97316" },
            { label: "B", color: "#eab308" },
            { label: "C", color: "#22c55e" },
            { label: "D", color: "#3b82f6" },
        ];

        let sortableInstances = [];
        let cachedCharactersData = []; // 用於保存 Firestore 抓回來的資料供重置使用

        // 🌟 多國語言名稱提取 (支援物件結構)
        const extractLocalString = (val) => {
            if (!val) return "";
            if (typeof val === 'string') return val.trim();
            if (Array.isArray(val)) return val.map(v => typeof v === 'string' ? v.trim() : v); 
            if (typeof val === 'object') {
                const currentLang = localStorage.getItem('user_lang') || window.currentLang || 'zh-TW';
                const str = val[currentLang] || val['zh-TW'] || val['zh'] || val['ja'] || val['en'] || Object.values(val)[0] || "";
                return typeof str === 'string' ? str.trim() : str;
            }
            return String(val).trim();
        };

        // 🌟 初始化主程式：改由 Module 啟動
        window.startApp = async function() {
            applyTranslations(); 
            initTiers();
            
            // 從 Firestore 讀取，失敗則 fallback 回 INITIAL_DATA
            if (typeof window.fetchCharactersFromFirestore === 'function') {
                cachedCharactersData = await window.fetchCharactersFromFirestore();
            } else {
                cachedCharactersData = (typeof INITIAL_DATA !== 'undefined') ? INITIAL_DATA : [];
            }
            
            initCharacterPool(cachedCharactersData);
        };

        function applyTranslations() {
            document.getElementById('pageTitle').innerHTML = `👑 ${getI18n('ui_tier_title') || '排行榜生成器'}`;
            document.getElementById('btnAddRow').innerHTML = `➕ ${getI18n('ui_tier_add_row') || '新增級別'}`;
            document.getElementById('btnReset').innerHTML = `🗑️ ${getI18n('ui_tier_reset') || '重置所有'}`;
            document.getElementById('btnExport').innerHTML = `📸 ${getI18n('ui_tier_export') || '輸出圖片'}`;
            document.getElementById('poolTitle').innerText = `👥 ${getI18n('ui_tier_pool_title') || '角色池 (拖曳至上方排行榜)'}`;
            
            const titleInput = document.getElementById('tierTitle');
            if (titleInput.value === '我的最愛排行榜') {
                titleInput.value = getI18n('ui_tier_default_title') || '我的最愛排行榜';
            }
        }
        
        function togglePoolGroup(id, btnId) {
            const group = document.getElementById(id);
            const btn = document.getElementById(btnId);
            if (group.classList.contains('collapsed')) {
                group.classList.remove('collapsed');
                group.style.maxHeight = '2000px';
                group.style.opacity = '1';
                btn.innerHTML = btn.innerHTML.replace('🔽', '🔼');
            } else {
                group.classList.add('collapsed');
                group.style.maxHeight = '0px';
                group.style.opacity = '0';
                btn.innerHTML = btn.innerHTML.replace('🔼', '🔽');
            }
        }
        
        function initTiers() {
            const container = document.getElementById('tierContainer');
            container.innerHTML = '';
            DEFAULT_TIERS.forEach(tier => createTierRow(tier.label, tier.color));
        }

        function createTierRow(labelText = "New", color = "#8b5cf6") {
            const container = document.getElementById('tierContainer');
            const rowId = 'tier_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
            
            const row = document.createElement('div');
            row.className = "flex bg-slate-800 border-b border-slate-950 min-h-[90px] relative group";
            
            row.innerHTML = `
                <div class="w-20 sm:w-28 flex items-center justify-center border-r border-slate-950 relative" style="background-color: ${color};">
                    <input type="text" value="${labelText}" class="w-full bg-transparent text-center font-black text-xl sm:text-2xl text-slate-900 outline-none px-1">
                    <div class="hide-on-export absolute left-1 top-1 flex flex-col gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                        <input type="color" value="${color}" onchange="this.parentElement.parentElement.style.backgroundColor = this.value" title="更改顏色">
                    </div>
                </div>
                <div id="${rowId}" class="tier-dropzone flex-1 flex flex-wrap content-start gap-2 p-2 min-h-[90px]"></div>
                <div class="hide-on-export w-8 flex flex-col items-center justify-center bg-slate-800/50 hover:bg-red-500/20 transition cursor-pointer" onclick="this.parentElement.remove()">
                    <span class="text-gray-500 hover:text-red-500">✖</span>
                </div>
            `;
            container.appendChild(row);

            setTimeout(() => {
                const dropzone = document.getElementById(rowId);
                const instance = new Sortable(dropzone, {
                    group: { name: 'shared', pull: true, put: true },
                    animation: 150,
                    ghostClass: 'opacity-30',
                    dragClass: 'scale-105',
                    emptyInsertThreshold: 15,
                    swapThreshold: 0.65,      
                    forceFallback: true,
                    fallbackOnBody: true,
                    fallbackTolerance: 3,
                    delay: 150,
                    delayOnTouchOnly: true,
                    filter: '.remove-btn'
                });
                sortableInstances.push(instance);
            }, 0);
        }

        function addTierRow() {
            createTierRow("Rank", "#94a3b8");
        }

        // 🌟 3. 初始化角色池：支援吃 Firestore 資料
        function initCharacterPool(charactersData) {
            const container = document.getElementById('characterPool');
            container.innerHTML = '';
            
            const personalities = ["共鳴", "雙面", "天真", "冷靜", "狂亂", "活潑", "憂鬱"]; 
            
            if (charactersData && charactersData.length > 0) {
                personalities.forEach(p => {
                    const chars = charactersData.filter(c => {
                        let pStr = String(c.personality || "");
                        let pList = Array.isArray(c.personality) ? c.personality : pStr.split(/[、,\/\s+]+/).map(s=>s.trim()).filter(Boolean);
                        
                        if (p === "雙面") return pList.length > 1 || pList.includes("雙重性格") || pList.includes("雙面");
                        return pList.includes(p) && pList.length === 1;
                    });
                    
                    if (chars.length > 0) {
                        createPoolSection(container, p, chars, false);
                    }
                });
            }

            // 處理 NPC
            createPoolSection(container, "NPC", NPC_LIST, true);
        }

        function createPoolSection(container, title, charList, isNPC) {
            const section = document.createElement('div');
            section.className = "flex flex-col bg-slate-100 dark:bg-slate-800/50 p-2 rounded-xl border border-dashed border-gray-300 dark:border-slate-700";
            
            const pColors = personalityColors[title] || "border-gray-400 text-gray-500";
            const borderClass = pColors.split(' ')[0];
            
            const groupId = 'pool_group_' + (isNPC ? 'NPC' : title);
            const btnId = 'pool_btn_' + (isNPC ? 'NPC' : title);
            const dropzoneId = 'pool_' + (isNPC ? 'NPC' : title);
            
            const header = document.createElement('div');
            header.className = "flex justify-between items-center cursor-pointer hover:bg-slate-200/50 dark:hover:bg-slate-700/50 p-1.5 rounded-lg transition mb-1";
            header.onclick = () => togglePoolGroup(groupId, btnId);
            
            const i18nTitle = getI18n(title) || title;
            const textClass = pColors.split(' ')[1] || "";

           header.innerHTML = `
                <h3 class="text-xs sm:text-sm font-black border-l-4 ${borderClass} pl-2 ml-1 text-gray-700 dark:text-gray-300"><span class="${textClass}">${i18nTitle}</span></h3>
                <span id="${btnId}" class="text-xs text-gray-400">🔼</span>
            `;
            
            const wrapper = document.createElement('div');
            wrapper.id = groupId;
            wrapper.className = "collapsible-content";
            wrapper.style.maxHeight = "2000px";
            wrapper.style.opacity = "1";

            const dropzone = document.createElement('div');
            dropzone.id = dropzoneId;
            dropzone.className = "tier-dropzone flex flex-wrap gap-2 p-1 min-h-[60px]";
            
            charList.forEach(char => {
                const charEl = createCharIcon(char, isNPC, borderClass);
                dropzone.appendChild(charEl);
            });

            wrapper.appendChild(dropzone);
            section.appendChild(header);
            section.appendChild(wrapper);
            container.appendChild(section);

            setTimeout(() => {
                const instance = new Sortable(document.getElementById(dropzoneId), {
                    group: { name: 'shared', pull: 'clone', put: true }, 
                    animation: 150,
                    ghostClass: 'opacity-30',
                    dragClass: 'scale-105',
                    forceFallback: true,
                    fallbackOnBody: true,
                    fallbackTolerance: 3,
                    delay: 150,
                    delayOnTouchOnly: true,
                    sort: false, 
                    onEnd: function(evt) {
                        if (evt.to !== evt.from && evt.to.id.startsWith('tier_')) {
                            const charId = evt.item.getAttribute('data-char-id');
                            evt.clone.classList.add('grayscale', 'opacity-40', 'pointer-events-none');
                            evt.clone.id = 'pool_orig_' + charId;
                        }
                    },
                    onAdd: function(evt) {
                        const charId = evt.item.getAttribute('data-char-id');
                        evt.item.remove();
                        const origEl = document.getElementById('pool_orig_' + charId);
                        if (origEl) {
                            origEl.classList.remove('grayscale', 'opacity-40', 'pointer-events-none');
                            origEl.removeAttribute('id'); 
                        }
                    }
                });
                sortableInstances.push(instance);
            }, 0);
        }

        // 🌟 產生角色圖示：適配 Firestore 資料結構
        function createCharIcon(charData, isNPC, fallbackBorder) {
            const el = document.createElement('div');
            
            // Firestore 資料使用 id 屬性，NPC 仍為字串
            let charId = isNPC ? charData : charData.id;
            
            el.setAttribute('data-char-id', charId);
            el.className = "cursor-grab active:cursor-grabbing flex flex-col items-center gap-0.5 group relative transition-all duration-300";
            
            // 直接讀取 Firestore 裡面的 spine 欄位，沒有則退回 id 或原本的字串
            let spineName = isNPC ? NPC_SPINE[charId] : (charData.spine || charId);
            
            // 讀取多語系顯示名稱
            let displayName = "";
            if (isNPC) {
                displayName = getI18n(charId).replace('(NPC)', '').trim();
            } else {
                displayName = extractLocalString(charData.names) || extractLocalString(charData.name) || charId;
            }
            
            let raceKey = isNPC ? "unknown" : (charData.race === "???" ? "unknown" : (charData.race || "unknown"));
            const raceSprite = SPRITE_CLASS_MAP[`race_${raceKey}`] || "sprite-Bg_Unknown";
            
            let borderClass = fallbackBorder;
            let displayPersonality = isNPC ? "NPC" : charData.personality;
            let customStyle = "";
            
            if (!isNPC && charData.personality) {
                let pList = [];
                if (Array.isArray(charData.personality)) {
                    pList = charData.personality;
                } else if (typeof charData.personality === 'string') {
                    pList = charData.personality.split(/[、,\/\s+]+/).map(s => s.trim()).filter(Boolean);
                }

                if (pList.length > 1) {
                    displayPersonality = "雙面";
                    borderClass = "dual-border-anim";
                    const c1 = HEX_COLORS[pList[0]] || "#c084fc"; 
                    const c2 = HEX_COLORS[pList[1]] || "#4ade80"; 
                    customStyle = `style="--c1: ${c1}; --c2: ${c2};"`;
                } else if (pList.length === 1) {
                    const singleP = pList[0];
                    if (singleP === "雙重性格" || singleP === "雙面") {
                        displayPersonality = "雙面";
                        borderClass = "dual-border-anim";
                    } else if (personalityColors[singleP]) {
                        borderClass = personalityColors[singleP].split(' ')[0];
                    }
                }
            }

            let innerHtml = '';
            if (isNPC) {
                const iconClass = NPC_ICON[charId];
                innerHtml = `
                    <div class="absolute inset-0 flex items-center justify-center opacity-80">
                        <div class="sprite-base sprite-common sprite-Bg_NPC shrink-0 scale-[0.7] sm:scale-[0.8]"></div>
                    </div>
                    <div class="w-full h-full bg-white/20 dark:bg-black/20 backdrop-blur-[1px] absolute inset-0 pointer-events-none"></div>
                    <div class="absolute inset-0 flex items-center justify-center z-10">
                        <div class="sprite-NPC ${iconClass} shrink-0 scale-[0.55] sm:scale-[0.65]"></div>
                    </div>
                `;
            } else {
                const charSpriteBase = CHAR_SPRITE_MAP[displayPersonality] || "sprite-char-innocence";
                const charSpriteClass = `sprite-${spineName}`;
                
                innerHtml = `
                    <div class="absolute inset-0 flex items-center justify-center opacity-80">
                        <div class="sprite-base sprite-common ${raceSprite} shrink-0 scale-[0.7] sm:scale-[0.8]"></div>
                    </div>
                    <div class="w-full h-full bg-white/20 dark:bg-black/20 backdrop-blur-[1px] absolute inset-0 pointer-events-none"></div>
                    <div class="absolute inset-0 flex items-center justify-center z-10">
                        <div class="sprite-base ${charSpriteBase} ${charSpriteClass} shrink-0 scale-[0.55] sm:scale-[0.65]"></div>
                    </div>
                `;
            }

            el.onclick = function() {
                if (this.parentElement && this.parentElement.id.startsWith('tier_')) {
                    returnToPool(this, charId);
                }
            };

            el.innerHTML = `
                <div class="char-icon-box w-12 h-12 sm:w-14 sm:h-14 rounded-xl border-2 ${borderClass} overflow-hidden shadow-sm hover:shadow-md transition-all relative flex items-center justify-center pointer-events-none" ${customStyle}>
                    ${innerHtml}
                </div>
                <span class="char-name text-[9px] sm:text-[10px] font-bold text-gray-500 text-center w-full truncate leading-tight pointer-events-none mt-0.5">${displayName}</span>
            `;

            return el;
        }

        function returnToPool(el, charId) {
            el.remove(); 
            
            const origEl = document.getElementById('pool_orig_' + charId);
            if (origEl) {
                origEl.classList.remove('grayscale', 'opacity-40', 'pointer-events-none');
                origEl.removeAttribute('id');
            }
        }
        
        function getI18n(key) {
            if (!key) return key;
            const lang = localStorage.getItem('user_lang') || 'zh-TW';
            if (typeof LANG_DICT !== 'undefined' && LANG_DICT[lang] && LANG_DICT[lang][key]) return LANG_DICT[lang][key];
            return key; 
        }

        function resetBoard() {
            const confirmMsg = getI18n('ui_tier_reset_confirm') || "確定要重置整個排行榜並將所有角色放回角色池嗎？";
            if(confirm(confirmMsg)) {
                sortableInstances.forEach(inst => inst.destroy());
                sortableInstances = [];
                initTiers();
                // 使用快取的 Firestore 資料進行重置
                initCharacterPool(cachedCharactersData);
            }
        }

        function exportImage() {
            const captureArea = document.getElementById('captureArea');
            
            const titleInput = document.getElementById('tierTitle');
            const titleValue = titleInput.value;
            const tempTitleSpan = document.createElement('h1');
            tempTitleSpan.className = "w-full text-center text-3xl sm:text-5xl font-black text-white mb-6 tracking-wide drop-shadow-md";
            tempTitleSpan.innerText = titleValue;
            titleInput.style.display = 'none';
            titleInput.parentNode.insertBefore(tempTitleSpan, titleInput);

            document.activeElement.blur();

            const colorPickers = captureArea.querySelectorAll('input[type="color"]');
            colorPickers.forEach(el => el.style.display = 'none');

            setTimeout(() => {
                html2canvas(captureArea, {
                    backgroundColor: "#0f172a", 
                    scale: 2, 
                    useCORS: true,
                    logging: false
                }).then(canvas => {
                    tempTitleSpan.remove();
                    titleInput.style.display = 'block';
                    colorPickers.forEach(el => el.style.display = '');

                    const link = document.createElement('a');
                    link.download = `Trickcal_TierList_${new Date().getTime()}.png`;
                    link.href = canvas.toDataURL('image/png');
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                }).catch(err => {
                    console.error("匯出失敗", err);
                    alert(getI18n('ui_tier_export_error') || "匯出圖片失敗，請檢查瀏覽器控制台錯誤。");
                    
                    tempTitleSpan.remove();
                    titleInput.style.display = 'block';
                    colorPickers.forEach(el => el.style.display = '');
                });
            }, 50);
        }
    </script>
</body>
</html>
